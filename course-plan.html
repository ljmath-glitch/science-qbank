function renderPlan(){const qs=active(),total=qs.length;planContent.innerHTML=`<div class="pool-actions no-print"><button class="primary" onclick="savePlan()">儲存課程計畫</button><button onclick="exportCSV()">匯出 CSV</button><span class="muted">日期、內容與影片備註皆可直接編輯。</span></div><div class="plan-grid">${PLAN.map((s,i)=>{const units=sessionUnits(s),n=qs.filter(q=>units.some(u=>mapped(q)===u||mapped(q).startsWith(u+'-'))).length,recent=qs.filter(q=>years().slice(-3).includes(questionYear(q))&&units.some(u=>mapped(q)===u||mapped(q).startsWith(u+'-'))).length,min=s.items.reduce((x,a)=>x+a.minutes,0),timePct=pct(min,PLAN.reduce((x,a)=>x+a.items.reduce((z,b)=>z+b.minutes,0),0)),examPct=pct(n,total),delta=timePct-examPct;return `<article class="plan-card"><h3>第 ${s.no} 堂 <input value="${esc(s.date)}" aria-label="第${s.no}堂日期" onchange="PLAN[${i}].date=this.value"></h3><div class="muted">講解 ${min}/85 分鐘｜歷屆 ${n} 題、近 3 年 ${recent} 題</div><ul class="session-items">${s.items.map((x,j)=>`<li><input value="${esc(x.topic)}" onchange="PLAN[${i}].items[${j}].topic=this.value"><input type="number" value="${x.minutes}" onchange="PLAN[${i}].items[${j}].minutes=+this.value;renderPlan()"></li>`).join('')}</ul><input placeholder="影片備註" value="${esc(s.video||'')}" onchange="PLAN[${i}].video=this.value"><p class="${Math.abs(delta)>=8?'alert':'muted'}">時間 ${timePct}% vs 命題 ${examPct}% ${Math.abs(delta)>=8?(delta>0?'（時間偏高）':'（時間偏低）'):''}</p></article>`}).join('')}</div><div class="section"><h2>單元總覽</h2><div class="table-wrap"><table class="data"><tr><th>單元</th><th>建議講解分鐘</th><th>5 年命題占比</th><th>近 3 年命題占比</th></tr>${UNITS.map(([u,n])=>{const mins=PLAN.reduce((sum,s)=>sum+s.items.filter(x=>x.topic.includes(u)).reduce((a,x)=>a+x.minutes,0),0),st=unitStats(qs,years(),u);return `<tr><td>${u} ${n}</td><td>${mins}</td><td>${st.allPct}%</td><td>${st.recentPct}%</td></tr>`}).join('')}</table></div></div>`}
var poolF={type:'',year:'',chart:false}; // 題目池篩選狀態（重繪時保留選項）
function renderPool(){const s=PLAN.find(x=>x.no===+(window.poolSession||1))||PLAN[0],units=sessionUnits(s),qs=active().filter(q=>units.some(u=>mapped(q)===u||mapped(q).startsWith(u+'-')));poolContent.innerHTML=`<div class="section"><div class="filters no-print"><label>堂次<select onchange="poolSession=this.value;renderPool()">${PLAN.map(x=>`<option value="${x.no}" ${x.no===s.no?'selected':''}>第 ${x.no} 堂</option>`).join('')}</select></label><label>題型<select id="poolType" onchange="poolF.type=this.value;renderPool()"><option value="">全部</option>${[...new Set(qs.map(q=>q.type).filter(Boolean))].map(x=>`<option ${x===poolF.type?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>年度<select id="poolYear" onchange="poolF.year=this.value;renderPool()"><option value="">全部</option>${years().map(x=>`<option ${x===poolF.year?'selected':''}>${x}</option>`).join('')}</select></label><label><input id="poolChart" type="checkbox" ${poolF.chart?'checked':''} onchange="poolF.chart=this.checked;renderPool()"> 有圖表</label></div><div class="pool-actions"><button class="primary" onclick="handoff()">加入選題並到組卷</button><button onclick="copyList()">複製題號清單</button><span class="muted">已選 ${selected.size} 題</span></div><div class="table-wrap"><table class="data"><tr><th></th><th>年度</th><th>題號</th><th>單元</th><th>題型</th><th>難度</th><th>題幹摘要</th></tr>${qs.filter(q=>(!poolF.type||q.type===poolF.type)&&(!poolF.year||questionYear(q)===poolF.year)&&(!poolF.chart||(q.chart&&q.chart!=='無'))).map(q=>`<tr><td><input type="checkbox" ${selected.has(q.id)?'checked':''} onchange="this.checked?selected.add('${q.id}'):selected.delete('${q.id}')"></td><td>${questionYear(q)}</td><td>${esc(q.no)}</td><td>${esc(mapped(q))}</td><td>${esc(q.type)}</td><td>${questionDifficulty(q)}</td><td>${esc(q.summary||'')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">沒有符合條件的題目；北模資料尚未入庫時會顯示空白。</td></tr>'}</table></div></div>`}async function savePlan(){try{const {error}=await sb.from('syllabus_doc').upsert({id:5,content:JSON.stringify({overrides:OVERRIDES,plan:PLAN})});if(error)throw error;alert('已儲存課程計畫')}catch(e){alert('儲存失敗：'+e.message)}}function handoff(){if(!selected.size)return alert('請先勾選題目');localStorage.setItem('cp_picks',JSON.stringify([...selected]));location.href='index.html?mode=compose&cp=1'}function copyList(){const text=active().filter(q=>selected.has(q.id)).map(q=>`${q.exam}#${q.no}`).join(', ');navigator.clipboard?.writeText(text);alert(text?'已複製題號清單':'請先勾選題目')}function exportCSV(){const lines=['堂次,日期,主題,單元分鐘,題數'];PLAN.forEach(s=>s.items.forEach(x=>lines.push([s.no,s.date,'"'+x.topic.replaceAll('"','""')+'"',x.minutes,active().filter(q=>x.topic.includes(mapped(q))).length].join(','))));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));a.download='學測地科_9堂課計畫.csv';a.click()}function reloadData(){sessionStorage.removeItem('cp_questions_v1');loadData(true)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));['trend','plan','pool'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('hidden',x!==b.dataset.tab))});loadData();</script></body></html>
