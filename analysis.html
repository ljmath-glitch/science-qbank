function qsEncode(state){var p=new URLSearchParams();Object.keys(state.filters||{}).forEach(function(k){var v=state.filters[k];if(Array.isArray(v)&&v.length)p.set(k,v.join(','));else if(v&&typeof v==='object'){if(v.min!=null)p.set('from',v.min);if(v.max!=null)p.set('to',v.max)}});if(state.includeIncomplete)p.set('incomplete','1');if(state.countMode!=='primary')p.set('count',state.countMode);if(state.weight!=='exam')p.set('weight',state.weight);return p.toString()}
function qsDecode(search){var p=new URLSearchParams(search||''), f={}, multi=['category','subject','school','grade','term','period','qtype','difficultyBand','chart'];multi.forEach(function(k){if(p.get(k))f[k]=p.get(k).split(',').filter(Boolean)});if(f.period)f.period=f.period.map(Number);if(p.get('from')||p.get('to'))f.year={min:p.get('from')?+p.get('from'):null,max:p.get('to')?+p.get('to'):null};return {filters:f,includeIncomplete:p.get('incomplete')==='1',countMode:p.get('count')||'primary',weight:p.get('weight')||'exam'}}
function filterSources(questions,category){var seen={};(questions||[]).forEach(function(q){var m=AnalysisCore.parseExam(q.exam,q.school),s=AnalysisCore.canonicalSource?AnalysisCore.canonicalSource(q.school,q.exam):{name:m.school,kind:'school'};if(!category.length||category.indexOf(m.category)>=0)if(s.name)seen[s.kind+'\u0000'+s.name]=s});return Object.keys(seen).sort().map(function(k){return seen[k]})}
function csvEscape(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function makeCsv(rows,cols){return '\ufeff'+[cols.map(function(c){return csvEscape(c.label)}).join(',')].concat(rows.map(function(r){return cols.map(function(c){return csvEscape(typeof c.get==='function'?c.get(r):r[c.key])}).join(',')})).join('\n')}

var TYPE_LABELS={A1:'A1 概念辨識',A2:'A2 概念推論',A3:'A3 概念比較',B1:'B1 圖表判讀',B2:'B2 圖表推論',B3:'B3 圖表計算',C1:'C1 實驗操作',C2:'C2 實驗設計',C3:'C3 實驗結果推論',D1:'D1 單步計算',D2:'D2 多步計算',D3:'D3 估算判斷',E1:'E1 情境判斷',E2:'E2 情境推論',E3:'E3 長文閱讀',填:'填 填充（非選）',計:'計 計算（非選）'};

function labelledField(label,key,values,labels){var sel=state.filters[key]||[];return '<label class="f">'+label+'<select multiple onchange="setMulti(\''+key+'\',this)">'+values.map(function(v){return '<option value="'+html(v)+'" '+(sel.indexOf(v)>=0?'selected':'')+'>'+html(labels[v]||v)+'</option>'}).join('')+'</select></label>'}
function sourceField(sources){var sel=state.filters.school||[], kinds={school:'學校',publisher:'出版社（模擬考）','exam-board':'大考單位',unknown:'未分類'},by={};sources.forEach(function(s){(by[s.kind]||(by[s.kind]=[])).push(s)});return '<label class="f">來源（學校／出版社）<input placeholder="搜尋來源" oninput="sourceSearch(this.value)"><select multiple onchange="setMulti(\'school\',this)">'+Object.keys(kinds).map(function(k){var rows=by[k]||[];return rows.length?'<optgroup label="'+kinds[k]+'">'+rows.map(function(s){return '<option value="'+html(s.name)+'" '+(sel.indexOf(s.name)>=0?'selected':'')+'>'+html(s.name)+'</option>'}).join('')+'</optgroup>':''}).join('')+'</select></label>'}
function unique(fn){return Array.from(new Set(DB.filter(function(q){return q.type!=='passage'}).map(fn).filter(function(x){return x!==null&&x!==undefined&&x!==''}))).sort()}
function renderFilters(){var cats=unique(function(q){return AnalysisCore.parseExam(q.exam,q.school).category}), sources=filterSources(DB,state.filters.category||[]),types=unique(function(q){return AnalysisCore.normType(q.type)}),charts=unique(function(q){return AnalysisCore.chartClass(q.chart)});document.getElementById('filterGrid').innerHTML=field('考試類別','category',cats)+field('科目','subject',unique(function(q){return q.field}))+sourceField(sources)+field('年級','grade',unique(function(q){return AnalysisCore.parseExam(q.exam,q.school).grade}))+field('學期','term',unique(function(q){return AnalysisCore.parseExam(q.exam,q.school).term}))+field('段考次','period',unique(function(q){return String(AnalysisCore.parseExam(q.exam,q.school).period||'')}))+labelledField('題型','qtype',types,TYPE_LABELS)+field('難度帶','difficultyBand',['簡單','中等','困難','極難'])+labelledField('圖表類型','chart',charts,CHART_LABELS)+'<label class="f">年度起<input type="number" value="'+((state.filters.year||{}).min||'')+'" onchange="setYear(\'min\',this.value)"></label><label class="f">年度迄<input type="number" value="'+((state.filters.year||{}).max||'')+'" onchange="setYear(\'max\',this.value)"></label><label class="toggle"><input type="checkbox" '+(state.includeIncomplete?'checked':'')+' onchange="setFlag(\'includeIncomplete\',this.checked)">包含不完整試卷</label><label class="toggle">計數<select onchange="setFlag(\'countMode\',this.value)"><option value="primary" '+(state.countMode==='primary'?'selected':'')+'>主要知識點</option><option value="involved" '+(state.countMode==='involved'?'selected':'')+'>知識點涉及</option></select></label><label class="toggle">權重<select onchange="setFlag(\'weight\',this.value)"><option value="exam" '+(state.weight==='exam'?'selected':'')+'>每份試卷等權</option><option value="question" '+(state.weight==='question'?'selected':'')+'>題數合併</option></select></label>'}
function setMulti(k,el){state.filters[k]=Array.from(el.selectedOptions).map(function(o){return o.value});if(k==='period')state.filters[k]=state.filters[k].map(Number);changed()}
function sourceSearch(v){document.querySelectorAll('select[multiple]').forEach(function(s){if(s.parentElement.textContent.indexOf('來源')>=0)Array.from(s.options).forEach(function(o){o.hidden=!!v&&!o.text.toLowerCase().includes(v.toLowerCase())})})}
function setYear(k,v){state.filters.year=state.filters.year||{};state.filters.year[k]=v?+v:null;changed()}function setFlag(k,v){state[k]=v;changed()}
function changed(){location.hash='#'+route+(qsEncode(state)?'?'+qsEncode(state):'');renderFilters();render()}
function clearFilters(){state={filters:{},includeIncomplete:false,countMode:'primary',weight:'exam'};changed()}
function filtered(){var f=Object.assign({},state.filters,{completeOnly:!state.includeIncomplete});return AnalysisCore.filterQuestions(DB,EXAMS,f)}
function modeLabel(){return (state.countMode==='primary'?'主要知識點':'知識點涉及')+'／'+(state.weight==='exam'?'每份試卷等權':'題數合併')}
function renderNav(){document.getElementById('nav').innerHTML=modules.map(function(m){return '<a class="'+(route===m[0]?'active':'')+'" href="#'+m[0]+(qsEncode(state)?'?'+qsEncode(state):'')+'">'+m[1]+'</a>'}).join('')}
function render(){renderNav();var qs=filtered(), complete=Object.values(EXAMS).filter(function(e){return e.complete&&qs.some(function(q){return AnalysisCore.parseExam(q.exam,q.school).key===e.key})}).length, omitted=Object.values(EXAMS).filter(function(e){return !e.complete}).length;document.getElementById('scope').textContent='納入分析：'+qs.length+' 題 ／ '+complete+' 份有效試卷（排除 '+omitted+' 份不完整）';var c=document.getElementById('content');if(route==='data')c.innerHTML=dataPage(qs);else {var m=modules.find(function(x){return x[0]===route})||modules[0];c.innerHTML='<div class="panel"><h2>'+m[1]+'</h2><p>'+m[3]+'</p><div class="notice">此模組預計於 Phase '+m[2]+' 完成。目前篩選已生效：<b>'+qs.length+'</b> 題／<b>'+complete+'</b> 份有效試卷；統計設定為「'+modeLabel()+'」。</div></div>'}document.querySelectorAll('[data-sort]').forEach(function(b){b.onclick=function(){sorts[b.dataset.sort]=sorts[b.dataset.sort]===1?-1:1;render()}})}
function metric(label,x){return '<div><span class="muted">'+label+'</span><b>'+x.count+'</b><small>'+Math.round(x.rate*1000)/10+'%</small></div>'}
function chartMappingRows(){var counts={};DB.forEach(function(q){var raw=(q.chart||'').trim();if(raw)counts[raw]=(counts[raw]||0)+1});return Object.keys(counts).sort().map(function(raw){return {raw:raw,chartClass:AnalysisCore.chartClass(raw),label:CHART_LABELS[AnalysisCore.chartClass(raw)]||AnalysisCore.chartClass(raw),n:counts[raw]}})}
function dataPage(qs){var d=AnalysisCore.dataQuality(DB,EXAMS), lows=Object.values(EXAMS).filter(function(e){return e.meta.confidence==='low'}), dup=AnalysisCore.flagDuplicates(DB), incom=Object.values(EXAMS).filter(function(e){return !e.complete}),charts=chartMappingRows();return '<div class="panel"><h2>08 資料管理</h2><p class="muted">資料品質以全題庫計算；目前篩選 '+qs.length+' 題。可排序與匯出各表格。</p><div class="metric">'+metric('缺少單元',d.missingUnit)+metric('缺少知識點',d.missingKp)+metric('缺少答案',d.missingAnswer)+metric('未評難度',d.unscoredDifficulty)+metric('疑似預設 2/2/2',d.suspectedDefaultDifficulty)+'</div><p class="notice">結構難度不等於答對率；疑似預設難度比例過高時，難度圖僅供參考。</p></div>'+tablePanel('圖表類型原值對照表',charts,[['raw','原值'],['label','粗分類'],['n','題數']],function(r){return [r.raw,r.label,r.n]})+tablePanel('被排除的不完整試卷',incom,[['key','試卷 key'],['n','題數'],['reason','原因']],function(e){return [e.key,e.n,e.reason]})+tablePanel('無法可靠解析的考卷名稱',lows,[['raw','考卷名稱'],['key','解析 key']],function(e){return [e.meta.raw,e.key]})+duplicatesPanel(dup)}
function sorted(rows,key){var dir=sorts[key]||1;return rows.slice().sort(function(a,b){var av=a[key]||a.key||a.raw||'',bv=b[key]||b.key||b.raw||'';return String(av).localeCompare(String(bv),'zh-Hant',{numeric:true})*dir})}
function tablePanel(title,rows,cols,values){var key=title;rows=sorted(rows,key);return '<div class="panel"><h3>'+title+'</h3><button class="btn" onclick="exportTable(\''+html(key)+'\')">匯出 CSV</button><div class="table-wrap"><table><thead><tr>'+cols.map(function(c){return '<th><button data-sort="'+html(key)+'">'+c[1]+' ↕</button></th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+values(r).map(function(v){return '<td>'+html(v)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div></div>'}
function duplicatesPanel(groups){groups=sorted(groups,'duplicates');return '<div class="panel"><h3>疑似重複題群組</h3><p class="muted">摘要、答案、主要知識點相同且跨試卷；僅供人工確認。</p><button class="btn" onclick="exportTable(\'duplicates\')">匯出 CSV</button><div class="table-wrap"><table><thead><tr><th><button data-sort="duplicates">試卷與題號 ↕</button></th><th><button data-sort="duplicates">摘要 ↕</button></th><th>操作</th></tr></thead><tbody>'+groups.map(function(g){var items=g.ids.map(function(id){return DB.find(function(q){return q.id===id})}).filter(Boolean);return '<tr><td>'+html(items.map(function(q){return q.exam+' #'+q.no}).join('；'))+'</td><td>'+html(items[0]&&items[0].summary)+'</td><td><button class="btn" onclick="openDrawer(\'疑似重複題\','+JSON.stringify(g.ids).replace(/"/g,'&quot;')+')">列出題目</button></td></tr>'}).join('')+'</tbody></table></div></div>'}
function exportTable(which){var rows,cols;if(which==='duplicates'){rows=AnalysisCore.flagDuplicates(DB).map(function(g){var x=g.ids.map(function(id){return DB.find(function(q){return q.id===id})}).filter(Boolean);return {papers:x.map(function(q){return q.exam+' #'+q.no}).join('；'),summary:x[0]&&x[0].summary,ids:g.ids.join(' ')}});cols=[{key:'papers',label:'試卷與題號'},{key:'summary',label:'摘要'},{key:'ids',label:'題目 ID'}]}else if(which==='圖表類型原值對照表'){rows=chartMappingRows();cols=[{key:'raw',label:'原值'},{key:'label',label:'粗分類'},{key:'n',label:'題數'}]}else if(which.indexOf('不完整')>=0){rows=Object.values(EXAMS).filter(function(e){return !e.complete});cols=[{key:'key',label:'試卷 key'},{key:'n',label:'題數'},{key:'reason',label:'原因'}]}else {rows=Object.values(EXAMS).filter(function(e){return e.meta.confidence==='low'}).map(function(e){return {raw:e.meta.raw,key:e.key}});cols=[{key:'raw',label:'考卷名稱'},{key:'key',label:'解析 key'}]}var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([makeCsv(rows,cols)],{type:'text/csv'}));a.download='analysis-'+which+'.csv';a.click();URL.revokeObjectURL(a.href)}
async function openDrawer(title,ids){document.getElementById('drawer').classList.add('open');document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerCount').textContent=ids.length+' 題';document.getElementById('drawerActions').innerHTML='<button class="btn" onclick="copyIds()">複製題號清單</button> <button class="btn primary" onclick="sendPicks()">加入選題並到組卷</button>';window.drawerIds=ids;var rows=[],missing=[];ids.forEach(function(id){var q=DB.find(function(x){return x.id===id});if(q&&q.q!==undefined)rows.push(q);else missing.push(id)});if(missing.length){for(var i=0;i<missing.length;i+=100){var r=await sb.from('questions').select('id,exam,no,unit,type,step,mem,con,ans,q,sol,field').in('id',missing.slice(i,i+100));if(r.data)rows=rows.concat(r.data)}}document.getElementById('drawerList').innerHTML=rows.map(function(q){var d=AnalysisCore.difficulty(q);return '<article class="question"><b>'+html(q.exam)+' #'+html(q.no)+'</b><div class="muted">'+html(q.field)+'｜'+html(q.unit)+'｜'+html(q.type)+'｜'+html(d.band||'未評')+'｜答案 '+html(q.ans)+'</div><details><summary>展開題幹</summary><p>'+html(q.q||'（題幹未載入）')+'</p></details></article>'}).join('')||'找不到題目。'}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}function copyIds(){navigator.clipboard.writeText((window.drawerIds||[]).join('\n'))}function sendPicks(){localStorage.setItem('cp_picks',JSON.stringify(window.drawerIds||[]));location.href='index.html?mode=compose&cp=1'}
function saveView(){var n=prompt('這個檢視的名稱：');if(!n)return;var x=JSON.parse(localStorage.getItem('an_views_v1')||'{}');x[n]=getAnalysisState();localStorage.setItem('an_views_v1',JSON.stringify(x));renderViews()}function renderViews(){var x=JSON.parse(localStorage.getItem('an_views_v1')||'{}');document.getElementById('savedViews').innerHTML=Object.keys(x).map(function(n){return '<button class="btn" onclick="loadView('+JSON.stringify(n).replace(/"/g,'&quot;')+')">'+html(n)+'</button><button class="btn" onclick="deleteView('+JSON.stringify(n).replace(/"/g,'&quot;')+')">×</button>'}).join('')}function loadView(n){state=JSON.parse(JSON.stringify(JSON.parse(localStorage.getItem('an_views_v1'))[n]));changed()}function deleteView(n){var x=JSON.parse(localStorage.getItem('an_views_v1'));delete x[n];localStorage.setItem('an_views_v1',JSON.stringify(x));renderViews()}
async function loadQuestions(force){document.getElementById('content').innerHTML='<div class="panel">載入題庫資料中…</div>';try{var cache=!force&&JSON.parse(sessionStorage.getItem('an_questions_v1')||'null');if(cache&&Date.now()-cache.ts<600000)DB=cache.data;else{DB=[];for(var from=0;;from+=1000){var r=await sb.from('questions').select('id,exam,no,type,unit,sub,kp,step,mem,con,chart,group_id,ans,summary,field,book,school').range(from,from+999);if(r.error)throw r.error;DB=DB.concat(r.data||[]);if(!r.data||r.data.length<1000)break}sessionStorage.setItem('an_questions_v1',JSON.stringify({ts:Date.now(),data:DB}))}EXAMS=AnalysisCore.buildExams(DB);renderFilters();renderViews();render()}catch(e){document.getElementById('content').innerHTML='<div class="panel error">資料載入失敗：'+html(e.message||e)+' <button class="btn" onclick="loadQuestions(true)">重試</button></div>'}}
function routeFromHash(){var raw=location.hash.slice(1)||'overview',a=raw.split('?');route=modules.some(function(m){return m[0]===a[0]})?a[0]:'overview';state=qsDecode(a[1]||'');if(DB.length){renderFilters();render()}}window.addEventListener('hashchange',routeFromHash);
const QBANK_LOCK_KEY='tzutzu_qbank_unlock_until',QBANK_LOCK_PW='LJ0970683519';function unlockQbank(){var i=document.getElementById('lockInput');if(i.value===QBANK_LOCK_PW){var until=Date.now()+7200000;sessionStorage.setItem(QBANK_LOCK_KEY,String(until));document.getElementById('lockScreen').style.display='none';return}document.getElementById('lockError').textContent='密碼錯誤，請再試一次。';i.focus()}(()=>{var until=+sessionStorage.getItem(QBANK_LOCK_KEY)||0;if(Date.now()<until)document.getElementById('lockScreen').style.display='none';else setTimeout(function(){document.getElementById('lockInput').focus()},80)})();routeFromHash();loadQuestions();window.qbankRefresh=function(){return loadQuestions(true)};
