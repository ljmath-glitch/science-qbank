function typeTrendSvg(stats){var years=stats.years,types=stats.distribution.slice(0,5),colors=['#850103','#c06c35','#5c7c65','#496a9e','#8b5a9f'];if(!years.length)return '<p class="muted">沒有可解析的學年／年度資料。</p>';var w=640,h=230,pad=42,inner=w-pad*2,base=h-34;var lines=types.map(function(t,ti){var pts=years.map(function(y,i){return (pad+(years.length===1?inner/2:i*inner/(years.length-1)))+','+(base-(y.types[t.type].share*(h-76)));}).join(' ');return '<polyline fill="none" stroke="'+colors[ti]+'" stroke-width="3" points="'+pts+'"/>';}).join('');var labels=years.map(function(y,i){var x=pad+(years.length===1?inner/2:i*inner/(years.length-1));return '<text x="'+x+'" y="'+(h-12)+'" text-anchor="middle" fill="currentColor" font-size="12">'+y.year+(y.sampleWarning?'*':'')+'</text>';}).join('');return '<div class="chart-key">'+types.map(function(t,i){return '<span style="--c:'+colors[i]+'">'+html(TYPE_LABELS[t.type]||t.type)+'</span>'}).join('')+'</div><svg class="trend-svg" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="各年度題型趨勢"><line x1="'+pad+'" y1="'+base+'" x2="'+(w-pad)+'" y2="'+base+'" stroke="#aaa"/>'+lines+labels+'</svg>'}

async function openDrawer(title,ids){document.getElementById('drawer').classList.add('open');document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerCount').textContent=ids.length+' 題';document.getElementById('drawerActions').innerHTML='<button class="btn" onclick="copyIds()">複製題號清單</button> <button class="btn primary" onclick="sendPicks()">加入選題並到組卷</button>';window.drawerIds=ids;var rows=[],missing=[];ids.forEach(function(id){var q=DB.find(function(x){return x.id===id});if(q&&q.q!==undefined)rows.push(q);else missing.push(id)});if(missing.length){for(var i=0;i<missing.length;i+=100){var r=await sb.from('questions').select('id,exam,no,unit,type,step,mem,con,ans,q,sol,field').in('id',missing.slice(i,i+100));if(r.data)rows=rows.concat(r.data)}}document.getElementById('drawerList').innerHTML=rows.map(function(q){var d=AnalysisCore.difficulty(q);return '<article class="question"><b>'+html(q.exam)+' #'+html(q.no)+'</b><div class="muted">'+html(q.field)+'｜'+html(q.unit)+'｜'+html(q.type)+'｜'+html(d.band||'未評')+'｜答案 '+html(q.ans)+'</div><details><summary>展開題幹</summary><p>'+html(q.q||'（題幹未載入）')+'</p></details></article>'}).join('')||'找不到題目。'}
