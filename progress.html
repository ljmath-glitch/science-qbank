<style>
:root{--bg:#f6f5f2;--card:#fff;--line:#e6e4de;--text:#2d3038;--muted:#6e6f74;--primary:#850103;--green:#2d9060;--red:#c0392b;--orange:#f9a12c;--ui-font:"PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}

body{font-family:var(--ui-font);font-weight:500;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

header .wrap{display:flex;align-items:center;gap:10px}.brand-head{display:flex;align-items:center;gap:12px;flex:1}.brand-logo{height:36px;width:36px;object-fit:contain;flex:none;padding-right:12px;box-sizing:content-box;border-right:1px solid #dfe3e9}.brand-copy h1{font-size:18px;font-weight:800;letter-spacing:.5px}.brand-copy .sub{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:1px}
.hbtn{padding:6px 13px;border:1px solid var(--line);border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:var(--text);font-family:inherit;text-decoration:none;display:inline-block;transition:.15s}.hbtn.home-icon,.hbtn.qbank-icon{width:30px;height:30px;padding:0;display:grid;place-items:center;border:none;background:transparent}.hbtn.home-icon svg,.hbtn.qbank-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hbtn:hover{border-color:var(--primary);color:var(--primary)}
.toolbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 0;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.toolbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toolbar label{font-size:13px;font-weight:600;white-space:nowrap}
.exam-tabs{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%;padding-top:2px}
.exam-tab{padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font:600 12px var(--ui-font);cursor:pointer;transition:.15s}
.exam-tab:hover{border-color:var(--primary);color:var(--primary)}
.exam-tab.active{border-color:var(--primary);background:var(--primary);color:#fff}
.exam-tab .tab-count{margin-left:4px;opacity:.8}
.exam-search{display:flex;align-items:center;gap:6px;flex-basis:100%;padding-top:2px}.exam-search input{flex:1;min-width:0;max-width:420px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font:400 13px var(--ui-font);outline:none}.exam-search input:focus{border-color:var(--primary)}
.tab-label{display:inline-flex;align-items:center;font:700 11px var(--ui-font);color:var(--muted);margin-right:2px}
.name-inp{padding:5px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;width:140px}

.tbl-wrap{overflow:auto;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);max-height:calc(100vh - 130px)}
table{width:100%;border-collapse:collapse;background:var(--card);min-width:860px}
thead th{background:#f2f1ec;font-size:12px;font-weight:700;padding:10px 12px;text-align:center;border-bottom:2px solid var(--line);white-space:nowrap;color:var(--muted);position:sticky;top:0;z-index:2}

thead th.left{text-align:left}

.center{text-align:center}

input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:var(--green)}
.note-inp{width:100%;padding:4px 8px;border:1px solid transparent;border-radius:5px;font-size:12px;font-family:inherit;background:transparent;color:var(--text)}

th.sort-header{cursor:pointer;user-select:none}
th.sort-header:hover{background:#e5ddd0}
.name-inp-cell{width:100%;padding:4px 8px;border:1px solid transparent;border-radius:5px;font-size:13px;font-family:inherit;background:transparent;color:var(--text);min-width:200px}
.name-inp-cell:hover{border-color:var(--line)}
.name-inp-cell:focus{outline:none;border-color:var(--primary);background:#fff}
.add-btn{margin-top:12px;padding:8px 16px;border:2px dashed var(--line);border-radius:8px;background:transparent;color:var(--muted);font-size:13px;font-family:inherit;cursor:pointer;width:100%;text-align:left}
.add-btn:hover{border-color:var(--primary);color:var(--primary);background:#faf0ee}
.del-btn{padding:2px 6px;border:none;border-radius:4px;background:transparent;color:#ccc;cursor:pointer;font-size:14px;line-height:1}
.del-btn:hover{background:#fee;color:var(--red)}
.link-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:3px;border:none;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;flex-shrink:0;text-decoration:none}

.link-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;display:block}

.review-btn,.review-actions button{font:600 12px var(--ui-font);border:1px solid var(--line);border-radius:6px;background:#fff;padding:5px 8px;cursor:pointer;color:var(--text)}.review-btn:hover,.review-actions button:hover{border-color:var(--primary);color:var(--primary)}
.review-row td{background:#fffdf9;padding:14px}.review-panel{max-width:100%;overflow:hidden}.review-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}.review-info{font-size:12px;color:var(--muted)}.review-actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.review-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}.review-table{min-width:760px;width:100%;font-size:12px;box-shadow:none}.review-table th{position:static;padding:7px}.review-table td{padding:7px;border-bottom:1px solid var(--line);background:#fff}.review-table .changed{background:#fff1df;color:#9a5200;font-weight:700}.review-table .same{color:var(--muted)}.review-table .bad{color:var(--red);font-weight:700}.review-summary{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.review-status{font-size:12px;margin:8px 0;color:var(--muted)}
.ai-link{font-size:11px;white-space:nowrap}.import-box{width:100%;min-height:70px;padding:7px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:6px}.issue-copy{font-size:11px;line-height:1.45;color:#8a5200;max-width:260px}.ai-view{max-width:1100px;margin:0 auto;padding:22px;font:15px/1.55 ui-monospace,"Noto Sans TC",monospace;background:#fff;color:#111}.ai-view h1{font:700 22px var(--ui-font);margin-bottom:5px}.ai-view .ai-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.ai-view button{padding:7px 10px;border:1px solid #777;border-radius:5px;background:#fff;cursor:pointer}.ai-question{border:1px solid #aaa;border-radius:6px;margin:16px 0;padding:14px;white-space:pre-wrap}.ai-question h2{font:700 17px var(--ui-font);margin:0 0 10px}.ai-field{margin:3px 0}.ai-field b{font-family:var(--ui-font)}.ai-meta{color:#444;margin:8px 0}.ai-json{display:none}.ai-empty{padding:30px;border:1px solid #aaa}
/* ── 手機版：表格轉卡片，避免橫向捲動 ── */
@media(max-width:600px){
  .wrap{padding:0 14px}
  header .wrap{gap:8px}
  .brand-logo{height:30px;width:30px;padding-right:9px}
  .brand-copy h1{font-size:13.5px;line-height:1.25}
  .brand-copy .sub{display:none}
  .hbtn{padding:6px 11px;font-size:12px}
  .toolbar .wrap{gap:8px}
  .stat{margin-left:0;flex-basis:100%}
  .main{padding:16px 0 48px}
  .tbl-wrap{max-height:none;overflow:visible;border:none;box-shadow:none;border-radius:0;background:transparent}
  table{min-width:0;background:transparent}
  thead{display:none}
  tbody,tbody tr,tbody td{display:block}
  tbody tr{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);margin-bottom:13px;padding:2px 2px 6px}
  tbody tr:hover td{background:transparent}
  tbody td{border:none;border-bottom:1px solid #f0ede6;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:44px}
  tbody td:last-child{border-bottom:none}
  tbody td:before{content:attr(data-label);font-size:12.5px;font-weight:700;color:var(--muted);flex:0 0 auto}
  tbody td.pg-name{border-bottom:1px solid var(--line);padding:12px 14px 10px}
  .name-inp-cell{min-width:0;font-size:15px;font-weight:700}
  .chk-cell input[type=checkbox]{width:24px;height:24px}
  .count-badge{font-size:13px}
  .note-inp{width:auto;flex:1;text-align:right;font-size:13px}
  .ts-cell{white-space:normal;text-align:right;line-height:1.4}
  .ts-cell b{font-weight:700}
  .review-row td{display:block}.review-row td:before{display:none}.audit-cell{align-items:flex-start!important;flex-direction:column}.review-table-wrap{max-width:100%}
}
  thead th small{display:block;font-weight:500;font-size:10.5px;color:var(--muted);margin-top:2px}
</style>

<body>

<header>
  <div class="wrap">
    <div class="brand-head"><img class="brand-logo" src="/logo.png" alt="茲茲文教"><div class="brand-copy"><h1>茲茲文教｜自然題庫 - 考卷進度</h1><div class="sub">TZUTZU SCIENCE QBANK · PROGRESS &amp; STATUS</div></div></div>
    <a class="hbtn home-icon" href="home.html" aria-label="回到首頁" title="回到首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
    <a class="hbtn qbank-icon" href="index.html" aria-label="題庫管理" title="題庫管理"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v7c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 12v7c0 1.7 3.1 3 7 3s7-1.3 7-3v-7"/></svg></a>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <label>更新者姓名：</label>
    <input class="name-inp" id="userName" placeholder="請填您的姓名" oninput="saveName()">
    <span class="saving-indicator" id="savingInd">儲存中…</span>
    <div class="stat" id="statLine"></div>
    <div class="exam-tabs" id="examTabs" aria-label="考卷種類篩選"></div>
    <div class="exam-tabs" id="gradeTabs" aria-label="年級篩選"></div>
    <div class="exam-search"><label class="tab-label" for="examSearch">搜尋</label><input id="examSearch" type="search" placeholder="輸入學校、年度、科目…，空格可同時比對多個關鍵字" oninput="if(!event.isComposing)setKeyword(this.value)" oncompositionend="setKeyword(this.value)"></div>
  </div>
</div>

<div class="cheer" id="cheer"></div>
<div class="demo-banner" id="demoBanner">示範模式：使用內建假資料與假 AI 建議，不會讀取或寫入雲端資料。</div>

<div class="main">
  <div class="wrap">
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th class="left sort-header" onclick="sortBy('displayName')">考卷名稱 ↕</th>
            <th>題數</th>
            <th style="min-width:240px">審核</th>
            <th>AI 修正</th>
            <th title="題幹與公式：照原卷逐題對過文字、單位、上下標、公式">題幹</th>
            <th title="答案：已對照原廠答案卷">答案</th>
            <th title="圖片：切完整、綁對題號與選項、圖號與題目文字相符">圖片</th>
            <th title="分類難度：冊／單元與難度三項已確認">分類難度</th>
            <th title="詳解已完成，並核對過結論與答案一致">詳解<small>選填</small></th>
            <th title="高清化：最後階段才做，不影響可出卷">高清化<small>選填</small></th>
            <th title="選填">其他</th>
            <th style="min-width:160px">備註</th>
            <th>最後更新</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="14" class="loading">載入中…</td></tr>
        </tbody>
      </table>
    </div>
    <button class="add-btn" onclick="addManualExam()">＋ 手動新增考卷</button>
    <div id="emptyMsg" class="empty" style="display:none">題庫中尚無題目，請先到題庫匯入資料。</div>
  </div>
</div>

<script>
const SUPABASE_URL      = 'https://esfepufqyeplafzbeeag.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_P_OpGwKYuWxpHMHCZdQRPA_1lCCLfNf';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const PROGRESS_ROW_ID = 2; // 存在 syllabus_doc 表的 id=2

let exams = [];       // [{school, grade, year, round, displayName, count}]
let progressMap = {}; // { id: {...} }
let activeKeyword = '';
let sortKey = 'year';
let sortAsc = false;
let activeExamKind = '全部';
let activeGrade = '全部';
let demoMode = new URLSearchParams(location.search).get('demo')==='1';
let aiMode = new URLSearchParams(location.search).get('ai')==='1';
let aiExam = new URLSearchParams(location.search).get('exam')||'';
let reviewQuestions = {}; // {exam id: questions[]}
let reviewState = {}; // {exam id: {open, rows, busy, abort}}
let passageByGroup = {}; // {group_id: passage question}
function gradeGroup(ex){
  const g=(ex&&ex.grade)||'';
  if(g==='七年級'||g==='八年級'||g==='九年級')return g;
  if(g==='高一'||g==='高二'||g==='高三'||g==='高中')return '高中';
  return '其他';
}

function bookToGrade(book){return book==='B1'||book==='B2'?'七年級':book==='B3'||book==='B4'?'八年級':book==='B5'||book==='B6'?'九年級':'';}
function gradeFromExam(exam,book){
  if(exam){
    if(exam.includes('九年級')||exam.includes('國三'))return '九年級';
    if(exam.includes('八年級')||exam.includes('國二'))return '八年級';
    if(exam.includes('七年級')||exam.includes('國一'))return '七年級';
    if(exam.includes('高一'))return '高一';
    if(exam.includes('高二'))return '高二';
    if(exam.includes('高三'))return '高三';
    if(exam.includes('高中')||exam.includes('學測')||exam.includes('分科測驗'))return '高中';
  }
  return bookToGrade(book);
}
function examRound(exam){if(!exam)return '';if(exam.includes('會考'))return '會考';if(exam.includes('學測'))return '學測';if(exam.includes('分科測驗'))return '分科測驗';const mk=exam.includes('模擬')||exam.includes('模考');if(exam.includes('第一次'))return mk?'第一次模擬考':'第一次段考';if(exam.includes('第二次'))return mk?'第二次模擬考':'第二次段考';if(exam.includes('第三次'))return mk?'第三次模擬考':'第三次段考';return exam;}
function examKind(ex){
  const text=[ex&&ex.round,ex&&ex.displayName,...((ex&&ex.examRaws)||[])].filter(Boolean).join(' ');
  if(/分科測驗|指考/.test(text))return '分科／其他';
  if(/學測/.test(text))return '學測';
  if(/會考/.test(text))return '會考';
  if(/模擬考|模考|模擬/.test(text))return '模擬考';
  if(/段考|第一次|第二次|第三次/.test(text))return '段考';
  return '分科／其他';
}
function setExamKind(kind){activeExamKind=kind;render();}
function setGrade(g){activeGrade=g;render();}
function setKeyword(v){activeKeyword=v.trim();render();}
// 進度表裡存過的「名稱」有些只是舊的自動名稱（沒人真的改過，例如少了學期或寫成「112上」）：這種直接用新的自動名稱；真的自訂過的才沿用
function _nameKey(n){return String(n||'').replace(/(上學期|下學期)/g,'').replace(/(\d{3})[上下]/g,'$1').replace(/-{2,}/g,'-').replace(/-(理化|地科|生物)$/,'').replace(/^-|-$/g,'');}
function shownNameOf(ex,p){
  if(p.customName===undefined||p.customName===null) return ex.displayName;
  return _nameKey(p.customName)===_nameKey(ex.displayName) ? ex.displayName : p.customName;
}
function examId(ex){return ex.isManual?manualKey(ex.displayName):makeId(ex.school,ex.grade,ex.year,ex.round,ex.subject);}
// 比對畫面上的名稱與題庫實際考試名稱；空格分開的每個關鍵字都要符合
function matchesKeyword(ex){
  if(!activeKeyword)return true;
  const p=progressMap[examId(ex)]||{};
  const text=[shownNameOf(ex,p),ex.displayName,...(ex.examRaws||[])].filter(Boolean).join(' ').toLowerCase();
  return activeKeyword.toLowerCase().split(/\s+/).every(k=>text.includes(k));
}
function isAllDone(ex){
  const p=progressMap[examId(ex)]||{};
  return !!(p.verified_questions&&p.ans_ok&&p.has_images&&p.class_ok);
}
function renderExamTabs(){
  const kinds=['全部','段考','模擬考','會考','學測','分科／其他'];
  // 種類分頁的數字反映目前年級篩選下的份數（兩個篩選互相連動）
  const base=exams.filter(ex=>matchesKeyword(ex)&&(activeGrade==='全部'||gradeGroup(ex)===activeGrade));
  const counts=Object.fromEntries(kinds.map(k=>[k,k==='全部'?base.length:base.filter(ex=>examKind(ex)===k).length]));
  document.getElementById('examTabs').innerHTML='<span class="tab-label">種類</span>'+kinds.map(k=>`<button type="button" class="exam-tab ${activeExamKind===k?'active':''}" aria-pressed="${activeExamKind===k}" onclick="setExamKind('${k}')">${k}<span class="tab-count">${counts[k]}</span></button>`).join('');
}
function renderGradeTabs(){
  const grades=['全部','七年級','八年級','九年級','高中','其他'];
  // 年級分頁的數字反映目前種類篩選下的份數
  const base=exams.filter(ex=>matchesKeyword(ex)&&(activeExamKind==='全部'||examKind(ex)===activeExamKind));
  const counts=Object.fromEntries(grades.map(g=>[g,g==='全部'?base.length:base.filter(ex=>gradeGroup(ex)===g).length]));
  // 完全沒有的年級分頁就不顯示（例如題庫全是國中就不會出現「高中」）
  const shown=grades.filter(g=>g==='全部'||g===activeGrade||counts[g]>0);
  document.getElementById('gradeTabs').innerHTML='<span class="tab-label">年級</span>'+shown.map(g=>`<button type="button" class="exam-tab ${activeGrade===g?'active':''}" aria-pressed="${activeGrade===g}" onclick="setGrade('${g}')">${g}<span class="tab-count">${counts[g]}</span></button>`).join('');
}
function composeDisplayName(school,grade,year,round,subject,semester){
  if(round==='會考') return (year||'')+'會考';
  // 年度欄位有的是「112上」、有的只有「114」：名稱一律拆成「年度（純數字）－學期－段考次」，學期從考試名稱判斷
  const y=String(year||'').replace(/[上下]$/,'');
  return [school,grade,y,semester,round,subject].filter(Boolean).join('-')||'（未命名）';
}
// 學期：考試名稱寫「上學期／下學期」或縮寫「113上」，否則看年度欄位結尾；都沒有就空白（例如跨冊的模擬考）
function parseSemester(exam,year){
  const e=String(exam||'');
  if(/上學期/.test(e)) return '上學期';
  if(/下學期/.test(e)) return '下學期';
  const m=e.match(/\d{3}([上下])-/)||String(year||'').match(/([上下])$/);
  return m?(m[1]==='上'?'上學期':'下學期'):'';
}
// 考卷名稱本身如果有寫科目（例如同校同次段考但地科、理化其實是兩張分開的考卷，各自命名時
// 才會加科目後綴），才把科目算進分組依據；沒寫科目的維持原本行為（同一次段考不分科目合併一列，
// 內部用「領域」欄位分科目即可）。這樣新增這個判斷不會影響原本就沒有科目後綴的考卷分組。
function parseSubject(exam){
  return (String(exam||'').match(/理化|生物|地科|自然|物理|化學/)||[])[0]||'';
}

// ── 載入所有題目清單 ──────────────────────────────
async function loadAll(){
  _cheerPending=true;
  document.getElementById('tbody').innerHTML = '<tr><td colspan="14" class="loading">載入中…</td></tr>';
  document.getElementById('emptyMsg').style.display = 'none';

  if(!demoMode){
    let hasSession=false;
    try{ const {data:{session}}=await sb.auth.getSession(); hasSession=!!session; }catch(e){}
    if(!hasSession){
      document.getElementById('tbody').innerHTML='<tr><td colspan="14" class="loading">尚未登入，無法讀取題庫資料。請先<a href="index.html">回題庫頁登入</a>後再開啟本頁（同一個網址下登入才會共用）。<br>只想看假資料示範：<a href="progress.html?demo=1">示範模式</a></td></tr>';
      return;
    }
  }
  document.getElementById('demoBanner').classList.toggle('show',demoMode);
  let allQs = [], from = 0;
  if(demoMode){
    allQs=demoQuestions();
  } else while(true){
    const {data, error} = await sb.from('questions').select('id,year,school,exam,book,book_name,domain,unit,sub,kp,step,mem,con,flag,basis,no,summary,q,ans,sol,type,chart,imgs,group_id').range(from, from + 999);
    if(error){document.getElementById('tbody').innerHTML='<tr><td colspan="14" class="loading">讀取題庫失敗：'+esc(error.message||String(error))+'</td></tr>';return;}
    if(!data || !data.length) break;
    allQs = allQs.concat(data);
    if(data.length < 1000) break;
    from += 1000;
  }

  // 依語意 key 分組：school + grade + year + examRound（＋考卷名稱本身有寫科目才加科目，見 parseSubject）
  const grouped = {};
  reviewQuestions={};
  passageByGroup=Object.fromEntries(allQs.filter(q=>q.type==='passage'&&q.group_id).map(q=>[q.group_id,q]));
  allQs.filter(q=>q.type!=='passage').forEach(q => {
    const school = (q.school||'').trim();
    const grade  = gradeFromExam(q.exam||'', q.book||'');
    const year   = (q.year||'').trim();
    const round  = examRound(q.exam||'');
    const subject = parseSubject(q.exam||'');
    const key    = makeId(school, grade, year, round, subject);
    if(!grouped[key]){ const semester = parseSemester(q.exam, year); grouped[key] = {school, grade, year, round, subject, semester, displayName: composeDisplayName(school,grade,year,round,subject,semester), count: 0, examRawSet: new Set()}; }
    grouped[key].count++;
    (reviewQuestions[key]||(reviewQuestions[key]=[])).push(q);
    if(q.exam) grouped[key].examRawSet.add(q.exam.trim());
  });
  exams = Object.values(grouped).map(ex => {
    ex.examRaws = [...ex.examRawSet].sort();
    delete ex.examRawSet;
    return ex;
  });

  progressMap = await loadProgress();
  if(aiMode){renderAiAssistantView();return;}
  // 九年級理化／地科原本各一列、各有進度：合併後的那一列若還沒有進度，沿用原本理化（其次地科）那列，避免勾選全部歸零
  const carry=[];
  exams.forEach(ex=>{
    if(ex.isManual||ex.grade!=='九年級'||ex.subject) return;
    const id=makeId(ex.school,ex.grade,ex.year,ex.round,'');
    if(progressMap[id]) return;
    const legacy=progressMap[makeId(ex.school,ex.grade,ex.year,ex.round,'理化')]||progressMap[makeId(ex.school,ex.grade,ex.year,ex.round,'地科')];
    if(legacy){ progressMap[id]={...legacy}; carry.push([id,legacy]); }
  });
  // 存回雲端，之後勾選才不會從空白開始（已有進度的列不覆蓋）
  if(carry.length) mergeAndSave(()=>{ carry.forEach(([id,v])=>{ if(!progressMap[id]) progressMap[id]={...v}; }); });
  // 合併手動新增的考卷
  const manuals = progressMap['__manuals__'] || [];
  manuals.forEach(name => {
    const key = 'manual|||' + name;
    if(!exams.find(e => makeId(e.school,e.grade,e.year,e.round)===key))
      exams.push({school:'',grade:'',year:'',round:'',displayName:name,count:null,isManual:true});
  });
  const hidden = new Set(progressMap['__hidden__'] || []);
  exams = exams.filter(ex => ex.isManual || !hidden.has(makeId(ex.school, ex.grade, ex.year, ex.round, ex.subject)));
  sortAndRender();
}

// ── 排序 ────────────────────────────────────────────
function sortBy(key){
  if(sortKey === key) sortAsc = !sortAsc;
  else { sortKey = key; sortAsc = true; }
  sortAndRender();
}

function sortAndRender(){
  exams.sort((a, b) => {
    const av = sortKey==='displayName' ? a.displayName : (a[sortKey]||a.displayName||'');
    const bv = sortKey==='displayName' ? b.displayName : (b[sortKey]||b.displayName||'');
    return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
  });
  render();
}

// ── 渲染 ────────────────────────────────────────────
function makeId(school, grade, year, round, subject){
  if(round==='會考') return '會考|||'+(year||'');
  if(school==='__manual__') return 'manual|||'+(grade||'');
  return [school||'', grade||'', year||'', round||''].join('|||')+(subject?'|||'+subject:'');
}
function manualKey(name){ return makeId('__manual__', name, '', ''); }

function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function fmtTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('zh-TW', {month:'2-digit', day:'2-digit'})
       + ' ' + d.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'});
}

const auditById={};
const TOGGLE_GUARDS={
  verified_questions:a=>a.flagged>0?`系統還標有 ${a.flagged} 題「待確認／疑似問題」。確定題幹與公式都已對照原卷嗎？`:'',
  ans_ok:a=>(a.missingAnswer>0||a.incompleteOptions>0)?`系統發現 ${a.missingAnswer} 題缺答案、${a.incompleteOptions} 題選項不全。確定答案都已對照答案卷嗎？`:'',
  has_images:a=>a.missingImage>0?`系統仍判定 ${a.missingImage} 題缺圖。確定圖都已切好並綁到正確題號嗎？`:'',
  class_ok:a=>(a.missingCategory>0||a.missingDifficulty>0)?`仍有 ${a.missingCategory} 題分類未填、${a.missingDifficulty} 題難度未填。確定都已確認嗎？`:''
};
async function toggle(id, field, val){
  const a=auditById[id],g=TOGGLE_GUARDS[field];
  if(val&&a&&g){const msg=g(a);if(msg&&!confirm(msg+'\n\n按「取消」會維持未勾選。')){render();return;}}
  const who = document.getElementById('userName').value.trim() || '未填姓名';
  await mergeAndSave(() => {
    progressMap[id] = {
      ...(progressMap[id]||{}),
      [field]: val,
      updated_by: who,
      updated_at: new Date().toISOString()
    };
  });
}

async function addManualExam(){

  if(!name || !name.trim()) return;
  const trimmed = name.trim();

  await mergeAndSave(() => {
    const hidden = progressMap['__hidden__'] || [];
    if(!hidden.includes(id)) progressMap['__hidden__'] = [...hidden, id];
  });
  await loadAll();
}

// ── 刪除手動列 ────────────────────────────────────────
async function deleteManual(name){
  if(!confirm('確定要刪除「'+name+'」這一列嗎？')) return;
  await mergeAndSave(() => {
    progressMap['__manuals__'] = (progressMap['__manuals__']||[]).filter(n=>n!==name);
    delete progressMap[manualKey(name)];
    exams = exams.filter(e=>!(e.isManual && e.displayName===name));
  });
}

function renderAudit(a){
  const parts=[['缺圖',a.missingImage,'#c0392b'],['選項',a.incompleteOptions,'#e67e22'],['缺答案',a.missingAnswer,'#d35400'],['分類',a.missingCategory,'#8e44ad'],['難度',a.missingDifficulty,'#2980b9'],['待確認',a.flagged,'#7f8c8d']].filter(x=>x[1]);
  const bad=parts.reduce((n,x)=>n+x[1],0), total=Math.max(a.total,1);
  const bar=bad?`<div class="audit-bar" aria-label="問題共 ${bad} 項">${parts.map(x=>`<span style="width:${x[1]/bad*100}%;background:${x[2]}" title="${x[0]} ${x[1]} 題"></span>`).join('')}</div>`:'';
  const txt=bad?parts.map(x=>`${x[0]} <b>${x[1]}</b>`).join('　'):'<span style="color:#2e7d32">✓ 無問題</span>';
  return `${bar}<div class="audit-copy">${txt}<br><b>可出卷 ${a.ready}/${total}</b></div>`;
}
function qaFlagsFor(q){
  const flags=QAGate.checkFields({題目:q.q||'',答案:q.ans||'',題型:q.type||'',圖表類型:q.chart||''},{hasImage:Array.isArray(q.imgs)&&q.imgs.length>0})||[];
  const cn={missing_image:'疑似缺少圖片',possible_missing_image:'可能缺少圖片',incomplete_options:'選項可能不完整',missing_answer:'答案未填'};
  return flags.map(x=>({rule:x[1]||x.code||'qa',description:cn[x[1]||x.code]||x[0]||'品質關檢查結果'}));
}
function aiExportFor(id,name){
  const qs=(reviewQuestions[id]||[]).map(q=>({...q,qa_flags:qaFlagsFor(q)}));
  const passages=Object.fromEntries(Object.entries(passageByGroup).map(([gid,p])=>[gid,p.q||'']));
  return ProgressReview.buildExport(name,qs,{passages});
}
function copyAiText(id,name){
  const data=aiExportFor(id,name);
  const plain=data.questions.map(x=>`# 題號 ${x['題號']}（id: ${x.id}）\n`+Object.entries(x.fields).map(([k,v])=>`${k}：${v}`).join('\n')+`\n品質關規則：${x.qa_flags.map(f=>f.rule+'：'+f.description).join('；')||'（無）'}\n圖片：${x.images.map(i=>`${i.url||i.name}／${i.role}／${i.source}／${i.status}`).join('；')||'（無）'}\n題組：${JSON.stringify(x.group)}`).join('\n\n');
  navigator.clipboard&&navigator.clipboard.writeText(plain).then(()=>alert('已複製完整文字。')).catch(()=>prompt('請複製：',plain));
}
function sampleAiResults(id){return (reviewQuestions[id]||[]).map((q,i)=>({id:q.id,verdict:i===0?'ok':'fix',issues:i===0?[]:[{field:'答案',problem:'請老師覆核圖片與答案是否一致',suggest:'不自動回寫'}],category:{book:q.book||'B1',book_name:q.book_name||'七上生物',unit:q.unit||'C2 生物體與營養'},difficulty:{step:Number(q.step)||2,mem:Number(q.mem)||2,concept:Number(q.con)||1},confidence:'高'}));}
function renderAiAssistantView(){
  const match=exams.find(ex=>{const p=progressMap[examId(ex)]||{};return aiExam===shownNameOf(ex,p)||aiExam===ex.displayName||(ex.examRaws||[]).includes(aiExam);});
  const app=document.body;
  if(!match){app.innerHTML='<main class="ai-view"><h1>AI 助手視圖</h1><p class="ai-empty">找不到指定考卷。請從進度表的「AI 助手視圖」按鈕開啟。</p></main>';return;}
  const id=examId(match),name=shownNameOf(match,progressMap[id]||{}),data=aiExportFor(id,name);
  const qs=data.questions.map(x=>{const flags=x.qa_flags.length?x.qa_flags.map(f=>`${f.rule}：${f.description}`).join('；'):'（無）';const imgs=x.images.length?x.images.map(i=>`${i.url||i.name}｜角色：${i.role}｜來源：${i.source}｜狀態：${i.status}`).join('\n'):'（無）';const fieldText=Object.entries(x.fields).map(([k,v])=>`<div class="ai-field"><b>${esc(k)}：</b>${esc(v)}</div>`).join('');return `<section class="ai-question" id="q-${esc(x.id)}" data-question-id="${esc(x.id)}" data-question-no="${esc(x['題號'])}" data-fields='${esc(JSON.stringify(x.fields))}'><h2>第 ${esc(x['題號'])} 題</h2>${fieldText}<div class="ai-meta"><b>品質關規則：</b>${esc(flags)}</div><div class="ai-meta"><b>圖片清單：</b>\n${esc(imgs)}</div><div class="ai-meta"><b>題組文章與同題組其他題號：</b>${esc(x.group.passage)}／${esc(x.group.other_question_numbers.join('、')||'（無）')}</div><div class="ai-meta"><b>目前章節：</b>${esc([x.fields['冊數'],x.fields['冊名'],x.fields['大單元']].join('／'))}　<b>目前難度值：</b>步驟 ${esc(x.fields['步驟分'])}、記憶 ${esc(x.fields['記憶分'])}、概念 ${esc(x.fields['概念分'])}</div></section>`;}).join('');
  app.innerHTML=`<main class="ai-view"><h1>AI 助手視圖：${esc(name)}</h1><p>共 ${data.questions.length} 題；每題完整資料均已直接放在本頁，不需展開。</p><div class="ai-actions"><button onclick="downloadJson('AI審閱檔_${esc(name)}.json',aiExportFor('${esc(id)}','${esc(name)}'))">下載 AI 審閱檔（JSON）</button><button onclick="copyAiText('${esc(id)}','${esc(name)}')">複製為文字</button>${demoMode?`<button onclick="downloadJson('sample-ai-review-results.json',sampleAiResults('${esc(id)}'))">下載示範 AI 審閱結果</button>`:''}<a href="progress.html">返回進度表</a></div>${qs}<template class="ai-json">${esc(JSON.stringify(data))}</template></main>`;
}
function toggleReview(id){reviewState[id]={...(reviewState[id]||{}),open:!(reviewState[id]||{}).open};render();}
function reviewRows(id){return (reviewState[id]||{}).rows||[];}
function renderReviewPanel(id,name){
  const s=reviewState[id]||{}, rows=s.rows||[];
  const bridge=getBridge();
  const status=s.status||(!bridge&&!demoMode?'尚未設定本機橋接：請先在題庫管理頁設定「本機 agy 橋接」。':'尚未取得 AI 建議。');
  const body=rows.length?`<div class="review-table-wrap"><table class="review-table"><thead><tr><th>套用</th><th>題號</th><th>題目摘要</th><th>章節（現值 → 建議）</th><th>難度（現值 → 建議）</th><th>判定／問題</th><th>信心</th></tr></thead><tbody>${rows.map((r,i)=>{
    const q=r.q||{}, ch=r.changes||{}, chapter=['book','book_name','unit'].map(k=>diffCell(q[k],r.suggestion&&r.suggestion[k],!!ch[k])).join('<br>');
    const difficult=['step','mem','con'].map(k=>diffCell(q[k],r.suggestion&&r.suggestion[k],!!ch[k])).join('／');
    const issues=(r.issues||[]).map(x=>`${x.field}：${x.problem}${x.suggest?' → '+x.suggest:''}`).join('\n');
    return `<tr><td><input type="checkbox" ${r.selected?'checked':''} ${r.parseable?'':'disabled'} onchange="setReviewSelection('${esc(id)}',${i},this.checked)"></td><td>${esc(q.no||r.id||String(i+1))}</td><td class="review-summary" title="${esc(q.summary||q.q||r.error||'')}">${esc(q.summary||q.q||r.error||'（無摘要）')}</td><td>${r.parseable?chapter:'<span class="bad">無法解析</span>'}</td><td>${r.parseable?difficult:'—'}</td><td class="issue-copy">${esc(r.verdict||'—')}${issues?'<br>'+esc(issues):''}</td><td>${esc(r.confidence||'低')}</td></tr>`;
  }).join('')}</tbody></table></div>`:'';
  const selected=rows.filter(r=>r.selected&&r.parseable&&Object.keys(r.changes||{}).length);
  return `<section class="review-panel"><div class="review-head"><button class="review-btn" ${s.busy?'disabled':''} onclick="askAi('${esc(id)}')">請 AI 建議章節與難度</button>${s.busy?`<button class="review-btn" onclick="stopAi('${esc(id)}')">中止</button>`:''}<span class="review-info">${esc(status)}</span></div><div class="review-actions"><button onclick="downloadJson('AI審閱檔_${esc(name)}.json',aiExportFor('${esc(id)}','${esc(name)}'))">下載 AI 審閱檔（JSON）</button><button onclick="copyAiText('${esc(id)}','${esc(name)}')">複製為文字</button>${demoMode?`<button onclick="downloadJson('sample-ai-review-results.json',sampleAiResults('${esc(id)}'))">下載示範結果</button>`:''}<label class="review-btn">選檔匯入<input type="file" accept="application/json,.json" hidden onchange="importAiFile('${esc(id)}',this.files[0])"></label><button onclick="importAiText('${esc(id)}')">貼上結果匯入</button></div><textarea id="ai-import-${esc(id)}" class="import-box" placeholder="貼上 AI 審閱結果 JSON：[{id 或 題號, verdict, issues, category, difficulty, confidence}]"></textarea>${rows.length?`<div class="review-actions"><button onclick="selectReview('${esc(id)}','all')">全選</button><button onclick="selectReview('${esc(id)}','changed')">只選有變動</button><button onclick="selectReview('${esc(id)}','none')">全不選</button><button onclick="applyReview('${esc(id)}','${esc(name)}')">套用勾選的 ${selected.length} 題</button>${s.backup?`<button onclick="restoreReview('${esc(id)}')">還原本次修改</button>`:''}</div>`:''}${body}<div class="review-status">${s.verify||''}</div></section>`;
}
function diffCell(oldv,newv,changed){return `<span class="${changed?'changed':'same'}">${esc(oldv==null?'—':String(oldv))} → ${esc(newv==null?'—':String(newv))}</span>`;}
function setReviewSelection(id,i,val){reviewState[id].rows[i].selected=val;render();}
function selectReview(id,kind){reviewRows(id).forEach(r=>r.selected=r.parseable&&(kind==='all'||(kind==='changed'&&Object.keys(r.changes||{}).length)));render();}
function importAiText(id,raw){
  const value=raw===undefined?(document.getElementById('ai-import-'+id)||{}).value:raw;
  const result=ProgressReview.importAiResults(value,reviewQuestions[id]||[]);
  const s=reviewState[id]||(reviewState[id]={open:true});
  if(!result.valid){s.rows=[{id:'',q:null,parseable:false,changes:{},confidence:'低',verdict:'無法解析',issues:[],selected:false,error:'JSON 格式不正確；請貼上陣列或 {suggestions:[…]}。'}];s.status='匯入失敗：JSON 格式不正確。';}
  else{s.rows=result.rows;s.status=`已匯入 ${result.rows.length} 筆；找不到題目的項目會標示「無法解析」，題幹／答案問題只供老師閱讀，不會寫回。`;}
  render();
}
function importAiFile(id,file){if(!file)return;const r=new FileReader();r.onload=()=>importAiText(id,String(r.result||''));r.readAsText(file,'utf-8');}
function getBridge(){try{const x=JSON.parse(localStorage.getItem('qbank_agy_bridge')||'null');return x&&x.url&&x.token?{url:String(x.url).replace(/\/+$/,''),token:x.token}:null;}catch(e){return null;}}
function chapterMap(){const seen=new Set(), rows=[];const add=x=>{if(x&&!seen.has(x)){seen.add(x);rows.push(x);}};if(typeof HANLIN_SYLLABUS==='string')HANLIN_SYLLABUS.split('\n').forEach(line=>{const a=line.split('|').map(x=>x.trim());if(a.length>=4)add(a.slice(0,4).join('|'));});Object.values(reviewQuestions).flat().forEach(q=>add([q.book,q.book_name,q.unit].map(x=>String(x||'').trim()).join('|')));return rows.filter(x=>x!=='||').slice(0,300);}
function demoQuestions(){return [
 {id:'demo-1',year:'115',school:'示範國中',exam:'115上第一次段考自然',book:'B1',book_name:'七上生物',domain:'生物',unit:'C1 生命的特性',sub:'1-1',kp:'細胞構造',step:1,mem:1,con:1,flag:false,no:'1',summary:'觀察細胞構造',q:'下列何者為細胞基本構造？ (A)細胞膜 (B)岩石 (C)雲 (D)風',ans:'A',sol:'細胞膜包覆細胞。',type:'A1',chart:'無',imgs:[]},
 {id:'demo-2',year:'115',school:'示範國中',exam:'115上第一次段考自然',book:'',book_name:'',unit:'',step:0,mem:0,con:0,flag:true,no:'2',summary:'光合作用條件',q:'如圖，植物進行光合作用需要何種條件？',ans:'',sol:'',type:'A2',chart:'圖',imgs:[{url:'https://example.invalid/demo.png',role:'題目',source:'示範',status:'待確認'}],group_id:'demo-g'},
 {id:'demo-passage',year:'115',school:'示範國中',exam:'115上第一次段考自然',type:'passage',group_id:'demo-g',q:'一株植物置於不同光照條件下，觀察其氣泡數量。',imgs:[]}
 ];}
function demoAi(q){return {id:q.id,book:'B1',book_name:'七上生物',unit:'C2 生物體與營養',step:2,mem:2,con:1,confidence:'高'};}
async function askAi(id){
  const state=reviewState[id]||(reviewState[id]={open:true}),qs=reviewQuestions[id]||[]; if(!qs.length){state.status='這份考卷沒有可分析的題目。';render();return;}
  const bridge=getBridge();if(!demoMode&&!bridge){state.status='尚未設定本機橋接。請在題庫管理頁的 AI 健檢設定連線碼後再試。';render();return;}
  state.busy=true;state.abort=false;state.rows=[];render(); const out=[];
  for(let n=0;n<qs.length;n+=15){if(state.abort)break;state.status=`AI 分析中：${Math.min(n+15,qs.length)}/${qs.length} 題…`;render();let list=null;
    try{if(demoMode)list=qs.slice(n,n+15).map(demoAi);else{const batch=qs.slice(n,n+15);const prompt='你是自然科題庫分類助理。只回傳 JSON：{"suggestions":[{"id":"題目id","book":"冊數","book_name":"冊名","unit":"大單元","step":1-3,"mem":1-3,"con":1-3,"confidence":"高|中|低"}]}。只能依章節對照建議，不確定請低信心。\n【章節對照】\n'+chapterMap().join('\n')+'\n【題目】\n'+batch.map(q=>JSON.stringify({id:q.id,題目:q.q||q.summary,現值:{book:q.book,book_name:q.book_name,unit:q.unit,step:q.step,mem:q.mem,con:q.con}})).join('\n');const res=await fetch(bridge.url+'/ai',{method:'POST',headers:{'content-type':'application/json','x-bridge-token':bridge.token},body:JSON.stringify({prompt,engine:localStorage.getItem('qbank_ai_engine')||'auto'})});const json=await res.json().catch(()=>({}));if(!res.ok)throw new Error(json.error||'橋接回應失敗');list=ProgressReview.parseAiJson(json.text);}
    }catch(e){state.status='AI 呼叫失敗：'+e.message;list=null;}
    const map=new Map((list||[]).map(x=>[x.id,x]));qs.slice(n,n+15).forEach(q=>{const sug=map.get(String(q.id));const norm=ProgressReview.normalizedSuggestion(q,sug);out.push({id:q.id,q,suggestion:sug,parseable:!!sug,changes:norm.changes,confidence:norm.confidence,selected:!!sug&&norm.confidence==='高'&&Object.keys(norm.changes).length>0});});
  }
  state.rows=out;state.busy=false;state.status=state.abort?'已中止，可保留已取得的建議。':`完成 ${out.length}/${qs.length} 題；預設只勾選高信心且有變動者。`;render();
}
function stopAi(id){if(reviewState[id])reviewState[id].abort=true;}
function downloadJson(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
async function applyReview(id,name){const s=reviewState[id],items=reviewRows(id).filter(r=>r.selected&&r.parseable&&Object.keys(r.changes||{}).length);const fields=ProgressReview.changedFieldCount(items);if(!items.length){alert('尚未勾選可套用的建議。');return;}if(!confirm(`將修改 ${items.length} 題、${fields} 個欄位；只會寫入章節與難度欄位，是否繼續？`))return;
  const backup=ProgressReview.buildBackup(name,items.map(r=>({id:r.id,before:r.q})));s.backup=backup;localStorage.setItem('progress_review_backup_'+id,JSON.stringify(backup));downloadJson(`考卷修正備份_${new Date().toISOString().replace(/[:.]/g,'-')}.json`,backup);if(demoMode){s.verify='示範模式：已模擬套用與驗證，未寫入資料。';render();return;}
  let ok=0,bad=[];for(const r of items){const patch=ProgressReview.editablePatch(r.q,r.suggestion);const {error}=await sb.from('questions').update(patch).eq('id',r.id);if(error){bad.push(r.id);continue;}const {data}=await sb.from('questions').select(ProgressReview.EDITABLE.join(',')).eq('id',r.id).maybeSingle();if(data&&Object.entries(patch).every(([k,v])=>String(data[k]??'')===String(v??'')))ok++;else bad.push(r.id);}
  s.verify=`已驗證 ${ok}/${items.length} 題與預期一致${bad.length?'；不一致：'+bad.join('、'):''}`;render();if(ok)loadAll();
}
async function restoreReview(id){const s=reviewState[id],backup=s&&s.backup;if(!backup){alert('找不到本次修改備份。');return;}if(!confirm(`還原「${backup.examName}」的 ${backup.items.length} 題？`))return;if(demoMode){s.verify='示範模式：已模擬還原，未寫入資料。';render();return;}let ok=0,bad=[];for(const item of backup.items){const patch=ProgressReview.restorePatch(item);const {error}=await sb.from('questions').update(patch).eq('id',item.id);if(error){bad.push(item.id);continue;}const {data}=await sb.from('questions').select(ProgressReview.EDITABLE.join(',')).eq('id',item.id).maybeSingle();if(data&&Object.entries(patch).every(([k,v])=>String(data[k]??'')===String(v??'')))ok++;else bad.push(item.id);}s.verify=`還原後已驗證 ${ok}/${backup.items.length} 題${bad.length?'；不一致：'+bad.join('、'):''}`;render();if(ok)loadAll();}

// ── Realtime：即時同步他人變更 ──────────────────────────
sb.channel('progress-sync')
  .on('postgres_changes', {
    event: 'UPDATE',
    schema: 'public',
    table: 'syllabus_doc',

  }, payload => {
    try {
      const newMap = JSON.parse(payload.new.content || '{}');
      progressMap = newMap;
      render();
    } catch(e){}
  })
  .subscribe();
