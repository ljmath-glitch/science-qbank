<style>@font-face{font-family:HuaKangTNR;font-display:swap;unicode-range:U+3000-303F,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FF00-FFEF;src:local('華康中圓體(P)'),local('華康中圓體'),url('/fonts/HuaKangP.ttf') format('truetype'),url('https://cdn.jsdelivr.net/gh/ButTaiwan/gensen-font@0.40/GenSenRounded-R.ttc') format('truetype')}@font-face{font-family:HuaKangTNR;font-display:swap;unicode-range:U+0000-024F;src:local('Times New Roman'),local('Times')}*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#2d3038;font:15px/1.65 "PingFang TC","Microsoft JhengHei",system-ui,sans-serif}header{padding:14px 20px;background:#fff;border-bottom:1px solid #e6e4de;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:19px;margin:0}.demo{background:#fff0dc;color:#874500;border:1px solid #e9c58e;border-radius:7px;padding:4px 9px;font-weight:800}.tools{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}button,label.button{font:inherit;font-size:13px;border:1px solid #d6c7b9;background:#fff;padding:7px 10px;border-radius:7px;cursor:pointer}button.primary{background:#850103;color:#fff;border-color:#850103}button:disabled{opacity:.45;cursor:not-allowed}.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;padding:14px;max-width:1500px;margin:auto}.side,.card{background:#fff;border:1px solid #e6e4de;border-radius:10px;padding:13px;box-shadow:0 2px 12px #2d303812}.side h2{font-size:14px;margin:0 0 8px}.exam{display:block;width:100%;text-align:left;margin:6px 0;padding:9px}.exam.active{border-color:#850103;background:#fff4f1}.muted{color:#6e6f74;font-size:13px}.review{min-width:0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pane{min-width:0}.pane h2{font-size:15px;margin:0 0 8px}.pdf{width:100%;height:340px;border:1px solid #e6e4de;border-radius:7px}.original,.result{white-space:pre-wrap;overflow-wrap:anywhere}.question-nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.badge{display:inline-block;border-radius:99px;pad <body><header><h1>題庫待審區</h1><span class="demo">示範模式：不會寫入雲端</span><div class="tools"><button onclick="loadCloud()">讀取雲端題目</button><label class="button">載入本機 JSON／NDJSON<input id="file" type="file" accept=".json,.ndjson,application/json" hidden onchange="loadFile(this.files[0])"></label><button onclick="exportReview()">匯出審核結果 JSON</button></div></header><main class="shell"><aside class="side"><h2>考卷</h2><div id="exams" class="notice">尚未載入資料</div></aside><section class="review" id="review"><div class="notice">請讀取雲端題目或載入本機 JSON／NDJSON。</div></section></main>
<script>
const SUPABASE_URL='https://esfepufqyeplafzbeeag.supabase.co', SUPABASE_ANON_KEY='sb_publishable_P_OpGwKYuWxpHMHCZdQRPA_1lCCLfNf';
const sb=window.supabase?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null, KEY='tzutzu_review_demo_v1'; let papers={}, pdfs={}, selected={exam:'',index:0}, state=JSON.parse(localStorage.getItem(KEY)||'{"reviews":{},"log":[]}');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const text=v=>v==null?'':String(v); const norm=v=>text(v).normalize?text(v).normalize('NFKC').replace(/[（）［］]/g,c=>c==='（'?'(':c==='）'?')':c==='［'?'[':']'):text(v); const ans=v=>norm(v).replace(/[\s,，、()（）.．]/g,'').toUpperCase().replace(/[○✕×]/g,c=>c==='○'?'O':'X');
const validImg=new Set(['圖','表','圖表','圖片','照片','示意圖','流程圖','電路圖','實驗圖','無']); const marker=/(?:\(([A-E])\)|\b([A-E])\s*[\.．、])/g, imageRef=/附圖|如圖|下圖|右圖|左圖|上圖|附表|如下表|表\s*[一二三四五六七八九十0-9]+|如表|見圖|圖\s*[（(]?[一二三四五六七八九十0-9A-Za-z]+[）)]?|示意圖|如[右左上下]圖/, noun=/電路圖|流程圖|長條圖|圓餅圖/;
function flags(q){let f=[], body=norm(q['題目']), type=norm(q['圖表類型']).trim(), bad=!validImg.has(type)||type==='無'; if(imageRef.test(body)&&bad)f.push(['block','missing_image','題目提及圖／表，但圖表類型為空、無或非法值。']);else if(noun.test(body)&&bad)f.push(['warn','possible_missing_image','題目僅出現圖表名詞，可能需附圖。']);let p=options(body), kind=kindOf(q,p), a=ans(q['答案']);if(['choice','multiple','truefalse'].includes(kind)){let allowed=kind==='truefalse'?'OXTFAB':Object.keys(p).join('')||'ABCDE';if(kind!=='truefalse'){let need=p.E?'ABCDE':'ABCD';if(!Object.keys(p).length||[...need].some(x=>!text(p[x]).trim()))f.push(['block','incomplete_options','選項缺少或內容為空。']);}if(!a)f.push(['block','missing_answer','答案為空。']);else if([...a].some(x=>!allowed.includes(x))||(kind!=='multiple'&&a.length!==1))f.push(['block','answer_out_of_range',`答案「${a}」不在選項範圍 ${allowed}。`]);}else if(!a)f.push(['block','missing_answer','答案為空。']);for(const [field,value] of [['題目',q['題目']],['題組文章',q['題組文章']],['詳解',q['詳解']]]){let x=norm(value);if(/試題結束|本卷結束|背面尚有試題|請翻頁|第\s*\d+\s*頁/.test(x))f.push(['warn','exam_end_noise',`${field}含考卷版面雜訊。`]);if(/^\s*-\s*\d+\s*-\s*$/m.test(x))f.push(['warn','page_number_noise',`${field}含獨立頁碼樣式。`]);if(/(?:^|\n)\s*\(\s*\d+\s*-\s*\d+\s*\)(?=\s|$)|(?:^|\s)\(\s*\d+\s*-\s*\d+\s*\)\s*(?:$|\n)/m.test(x))f.push(['warn','page_label_noise',`${field}含行首或行尾頁面標籤。`]);if(/圖[一二三四五六七八九十]+(?:圖[一二三四五六七八九十]+)+\s*[。．]?$/.test(x))f.push(['warn','trailing_figure_labels',`${field}題末有連黏圖號。`]);if(/(?:\\times|×|x)\s*10(?:\$?\s*[+\-−－]\s*\d+|\d{2,})/i.test(x))f.push(['warn','flattened_exponent',`${field}疑似次方壓平。`]);if(/(?<![A-Za-z0-9])(?:cm|m)(?:2|3)|m\/s2(?![A-Za-z0-9])/i.test(x))f.push(['warn','flattened_square_unit',`${field}疑似單位上標遺失。`]);if(/(?:H2O|CO2|O2|N2|H2|H2SO4|HCl|NaCl|NH3|CH4|CaCO3)(?![A-Za-z0-9])/i.test(x)||/(?<![A-Za-z0-9])(?:I|R|V|Q|x|y|z)\d+(?![A-Za-z0-9])/.test(x))f.push(['warn','flattened_subscript',`${field}疑似化學式或變數下標壓平。`]);}if(/\\mathrm\s*\{\s*\([A-EＡ-Ｅ]\)/.test(body))f.push(['warn','latex_option_label','LaTeX 的 \\mathrm 內含選項標號。']);return f}
function options(s){let m=[...s.matchAll(marker)],best=[];for(let i=0;i<m.length;i++){if((m[i][1]||m[i][2]).toUpperCase()!=='A')continue;let run=[m[i]],e=66;for(let j=i+1;j<m.length;j++){let l=(m[j][1]||m[j][2]).toUpperCase();if(l.charCodeAt(0)===e){run.push(m[j]);e++}else if(l==='A')break}if(run.length>=2&&run.length>=best.length)best=run}return Object.fromEntries(best.map((x,i)=>[(x[1]||x[2]).toUpperCase(),s.slice(x.index+x[0].length,i+1<best.length?best[i+1].index:s.length).trim()]))}
function kindOf(q,p){let k=norm(q['題型']).toLowerCase();if(/填充|計算|非選|問答|簡答|作答/.test(k))return'nonchoice';if(/是非|判斷/.test(k))return'truefalse';if(/複選|多選/.test(k))return'multiple';let sem=Object.values(p).map(x=>norm(x).replace(/[\s,，、.．:：;；()\[\]{}「」『』]/g,'').toUpperCase().replace(/[○✕×]/g,c=>c==='○'?'O':'X'));if(!k.trim()&&Object.keys(p).length===2&&sem.some(x=>['正確','是','對','O','T','TRUE','YES'].includes(x))&&sem.some(x=>['錯誤','否','錯','X','F','FALSE','NO'].includes(x)))return'truefalse';return(/選擇|單選/.test(k)||Object.keys(p).length)?'choice':'nonchoice'}
function paperFlags(qs){let f=[],sections=[[]];qs.forEach((q,i)=>{let n=/^[1-9]\d*$/.test(text(q['題號']).trim())?+q['題號']:null;if(n===null){f.push(['block','invalid_question_number',`第 ${i+1} 筆題號不是正整數。`]);return}if(sections.at(-1).length&&n===1&&(norm(q['大題']).trim()||sections.at(-1).at(-1)[1]>1))sections.push([]);sections.at(-1).push([i,n])});sections.filter(x=>x.length).forEach(s=>{let v=s.map(x=>x[1]),seen=new Set;if(v[0]!==1)f.push(['block','missing_first_question_number',`此大題從 ${v[0]} 開始，缺第 1 題。`]);v.forEach(n=>{if(seen.has(n))f.push(['block','duplicate_question_number',`題號 ${n} 重複。`]);seen.add(n)});v.slice(1).forEach((n,i)=>{if(n<v[i])f.push(['warn','out_of_order_question_number',`題號由 ${v[i]} 倒退為 ${n}，可能是大題重編號。`])});for(let n=1;n<=Math.max(...v);n++)if(!seen.has(n))f.push(['block','missing_question_number',`題號缺 ${n}。`])});let g={};qs.forEach(q=>{let id=text(q['題組ID']).trim();if(id)(g[id]??=[]).push(q)});Object.entries(g).forEach(([id,x])=>{if(!x.some(q=>text(q['題組文章']).trim()))f.push(['block','missing_group_article',`題組 ${id} 的所有子題皆無題組文章。`])});return f}
function key(q){return q.id||[q['考試名稱'],q['題號']].join('::')} function review(q){return state.reviews[key(q)]||{orig:structuredClone(q),statuses:{stem:q.stem_status||'pending',ans:q.ans_status||'pending',sol:q.sol_status||'pending',img:q.img_status||'pending'},deferred:false}}
function persist(action,q){state.log.unshift({at:new Date().toISOString(),action,question:key(q)});localStorage.setItem(KEY,JSON.stringify(state))} function setStatus(name,val){let q=current(),r=review(q);state.reviews[key(q)]={...r,statuses:{...r.statuses,[name]:val}};persist(`將 ${name} 改為 ${val}`,q);render()} function current(){return papers[selected.exam]?.[selected.index]}
function render(){let list=Object.entries(papers),box=document.getElementById('exams');box.innerHTML=list.length?list.map(([name,qs])=>{let ok=qs.filter(q=>{let r=review(q),s=r.statuses;if(flags(q).some(x=>x[0]==='block'))return false;return['approved','n/a'].includes(s.stem)&&['approved','n/a'].includes(s.ans)&&['approved','n/a'].includes(s.img)}).length;return `<button class="exam ${name===selected.exam?'active':''}" onclick="pick(${JSON.stringify(name)})"><b>${esc(name)}</b><br><span class="muted">${ok}/${qs.length} 可啟用 · ${paperFlags(qs).length} 考卷旗標</span></button>`}).join(''):'尚未載入資料';let q=current();if(!q){document.getElementById('review').innerHTML='<div class="notice">此考卷沒有題目。</div>';return}let r=review(q),f=flags(q),s=r.statuses,missing=[['stem','題幹'],['ans','答案'],['img','圖片']].filter(([x])=>!['approved','n/a'].includes(s[x])).map(x=>x[1]), blocks=f.filter(x=>x[0]==='block'),enable=!missing.length&&!blocks.length;let images=Array.isArray(q['圖片'])?q['圖片']:(Array.isArray(q.imgs)?q.imgs:[]);let pdf=pdfs[selected.exam];document.getElementById('review').innerHTML=`<div class="question-nav"><button onclick="move(-1)" ${selected.index?'':'disabled'}>上一題</button><b>第 ${esc(q['題號'])||selected.index+1} 題</b><span class="badge">${selected.index+1}/${papers[selected.exam].length}</span><button onclick="move(1)" ${selected.index+1<papers[selected.exam].length?'':'disabled'}>下一題</button></div><div class="columns"><div class="card pane"><h2>原始考卷</h2>${pdf?`<embed class="pdf" src="${esc(pdf)}" type="application/pdf">`:'<p class="muted">未對應原稿 PDF</p>'}<hr><div class="original">${esc((r.orig||q)['題目'])}</div></div><div class="card pane"><h2>辨識結果</h2><div class="result math">${esc(q['題目'])}</div><p><b>選項：</b>${esc(JSON.stringify(options(q['題目'])))}</p><p class="answer">答案：${esc(q['答案'])||'（空白）'}</p><p><b>詳解：</b></p><div class="result math">${esc(q['詳解'])||'（空白）'}</div><div class="images">${images.map(i=>`<img src="${esc(typeof i==='string'?i:i.src||'')}" alt="題目圖片">`).join('')}</div></div></div><div class="card flags"><b>品質關</b>${[...paperFlags(papers[selected.exam]),...f].map(x=>`<div class="flag ${x[0]}"><b>${x[0]} · ${x[1]}</b>：${esc(x[2])}</div>`).join('')||'<p class="muted">無旗標</p>'}<div class="statuses">${[['stem','題幹'],['ans','答案'],['sol','詳解'],['img','圖片']].map(([n,label])=>`<div class="status"><label>${label}</label><select onchange="setStatus('${n}',this.value)">${['pending','approved','blocked','n/a'].map(v=>`<option ${s[n]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}</div><div class="muted">${s.sol==='approved'||s.sol==='n/a'?'':'詳解尚未審核：這會顯示提醒，但不列入此版啟用按鈕的必要條件。'}</div><div class="actions"><button class="primary" ${enable?'':'disabled'} title="${missing.length?'尚缺：'+missing.join('、'):(blocks.length?'品質關仍有 block，需先修正':'')}" onclick="enableQuestion()">啟用${missing.length?'（尚缺：'+missing.join('、')+'）':(blocks.length?'（品質關 block '+blocks.length+' 項，需先修正）':'')}</button><button onclick="defer()">暫緩</button><button onclick="saveNext()">儲存並下一題</button><button onclick="revert()">還原辨識原始結果</button></div><div class="log"><b>本機異動紀錄</b>${state.log.slice(0,12).map(x=>`<div>${esc(x.at)}　${esc(x.action)}</div>`).join('')||'<div>尚無異動</div>'}</div></div>`;document.querySelectorAll('.math').forEach(el=>{if(window.katex)el.innerHTML=el.textContent.replace(/\$([^$]+)\$/g,(_,m)=>{try{return katex.renderToString(m,{throwOnError:false})}catch{return esc(m)}})});}
function pick(name){selected={exam:name,index:0};render()}function move(n){selected.index+=n;render()}function defer(){let q=current(),r=review(q);state.reviews[key(q)]={...r,deferred:true};persist('暫緩',q);move(selected.index+1<papers[selected.exam].length?1:0)}function saveNext(){persist('儲存並下一題',current());if(selected.index+1<papers[selected.exam].length)move(1);else render()}function enableQuestion(){persist('標記為可啟用（僅本機）',current());alert('已在本機標記；示範模式不會寫入雲端。')}function revert(){let q=current(),r=review(q);papers[selected.exam][selected.index]=structuredClone(r.orig);delete state.reviews[key(q)];persist('還原辨識原始結果',q);render()}
async function loadCloud(){if(!sb)return alert('Supabase 程式庫未載入。');try{let data=[],from=0;for(;;){let x=await sb.from('questions').select('*').range(from,from+999);if(x.error)throw x.error;data.push(...x.data);if(x.data.length<1000)break;from+=1000}let articles=Object.fromEntries(data.filter(x=>x.type==='passage'&&x.group_id).map(x=>[x.group_id,x.q||'']));let rows=data.filter(row=>row.type!=='passage').map(row=>({'題號':row.no,'題目':row.q,'答案':row.ans,'題型':row.type,'圖表類型':row.chart,'題組文章':articles[row.group_id]||'','題組ID':row.group_id,'詳解':row.sol,'考試名稱':row.exam,'大題':row.section,'圖片':row.imgs,stem_status:row.stem_status||'pending',ans_status:row.ans_status||'pending',sol_status:row.sol_status||'pending',img_status:row.img_status||'pending',id:row.id}));papers=Object.groupBy?Object.groupBy(rows,q=>q['考試名稱']||'未命名考卷'):rows.reduce((a,q)=>((a[q['考試名稱']||'未命名考卷']??=[]).push(q),a),{});try{let x=await sb.from('syllabus_doc').select('content').eq('id',4).maybeSingle();pdfs=JSON.parse(x.data?.content||'{}')}catch{pdfs={}}selected={exam:Object.keys(papers)[0]||'',index:0};render()}catch(e){alert('讀取失敗（若新審核欄位尚未建立，頁面會以 pending 顯示）：'+e.message)}}
function loadFile(file){if(!file)return;let rd=new FileReader;rd.onload=()=>{try{let raw=rd.result.trim(),data=raw.startsWith('{')?JSON.parse(raw):raw.split(/\r?\n/).filter(Boolean).map(JSON.parse);papers=Array.isArray(data)?Object.groupBy?Object.groupBy(data,q=>q['考試名稱']||q.exam||'本機資料'):data.reduce((a,q)=>((a[q['考試名稱']||q.exam||'本機資料']??=[]).push(q),a),{}):data;selected={exam:Object.keys(papers)[0]||'',index:0};render()}catch(e){alert('檔案格式無法讀取：'+e.message)}};rd.readAsText(file,'utf-8')}
function exportReview(){let blob=new Blob([JSON.stringify({exported_at:new Date().toISOString(),reviews:state.reviews,log:state.log},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='review-result.json';a.click();URL.revokeObjectURL(a.href)}

</script></body></html>
