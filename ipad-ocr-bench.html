<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iPad OCR 測試</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:16px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:760px;margin:auto;padding:20px 14px 44px}h1{font-size:24px;margin:0 0 8px}.note,.card{background:#fff;border:1px solid #dce3ed;border-radius:14px;padding:14px;margin:12px 0;line-height:1.55}.note{font-size:14px}input,button{font:inherit}input[type=file]{width:100%;padding:13px;background:#f5f7fa;border-radius:10px;border:1px dashed #9aa9bc}button{min-height:48px;margin-top:12px;border:0;border-radius:12px;padding:10px 18px;background:#1367d1;color:#fff;font-weight:700;touch-action:manipulation}button:disabled{opacity:.5}#copy{background:#526071;margin-left:8px}pre{white-space:pre-wrap;word-break:break-word;margin:0;font:13px ui-monospace,SFMono-Regular,monospace;line-height:1.55}.stage{border-left:4px solid #9aa9bc}.ok{border-left-color:#07833f}.bad{border-left-color:#ba3b25}.run{border-left-color:#1367d1}.small{font-size:13px;color:#48566a}
</style><main>
<h1>iPad 本機 OCR／切圖測試</h1>
<div class="note">PDF／圖片與 Excel 都只留在這台裝置的瀏覽器記憶體，沒有上傳。請用 HTTP/HTTPS 開啟（不可直接以 <code>file://</code> 開啟）。OCR 先用 WebGPU 跑完整份，再用 WASM（CPU）跑第 1 頁比較；切圖模型用 WASM 跑完整份；即使一段失敗，其餘測試仍會繼續。第一次要下載約 125 MB 的版面模型，請連 Wi-Fi。</div>
<div class="card"><input id="file" type="file" accept="application/pdf,image/*"><button id="start">開始測試</button><button id="copy" disabled>複製結果</button></div>
<div class="card"><b>裝置資訊</b><pre id="device"></pre></div>
<section id="stages"></section>
</main><script type="module">
const $=s=>document.querySelector(s), stages=$('#stages'), KEY='ipad-ocr-bench-interrupted';
const S={pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs',worker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs',ort:'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.mjs',wasm:'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/',py:'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.mjs'};
const logs=[];function sec(v){return (v/1000).toFixed(2)+' 秒'}function card(name){let e=document.createElement('article');e.className='card stage run';e.innerHTML='<b>'+name+'</b><pre>等待中…</pre>';stages.append(e);return e.querySelector('pre')}function say(el,text,kind='run'){el.parentElement.className='card stage '+kind;el.textContent=text}function log(t){logs.push(t);$('#copy').disabled=false}function err(e){return e?.message||String(e)}
$('#device').textContent=`userAgent: ${navigator.userAgent}\nhardwareConcurrency: ${navigator.hardwareConcurrency??'未知'}\ndeviceMemory: ${navigator.deviceMemory??'未提供'} GB\nWebGPU API: ${navigator.gpu?'可用':'未提供'}`;
try{const old=localStorage.getItem(KEY);if(old)stages.innerHTML='<div class="card stage bad"><b>中斷提醒</b><pre>上次可能在 '+old+' 時中斷或重新載入。</pre></div>'}catch{}
async function pdfjs(){let p=await import(S.pdf);p.GlobalWorkerOptions.workerSrc=S.worker;return p}function canvas(w,h){let c=document.createElement('canvas');c.width=w;c.height=h;return c}
async function pages(file){if(!file)throw Error('未選擇 PDF 或圖片（本段略過）。');if(!/\.pdf$/i.test(file.name)){let u=URL.createObjectURL(file),im=new Image();try{await new Promise((yes,no)=>{im.onload=yes;im.onerror=no;im.src=u});let c=canvas(im.naturalWidth,im.naturalHeight);c.getContext('2d').drawImage(im,0,0);return [async()=>c]}finally{URL.revokeObjectURL(u)}}let p=await pdfjs(),d=await p.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;return Array.from({length:d.numPages},(_,i)=>async()=>{let pg=await d.getPage(i+1),v=pg.getViewport({scale:3}),c=canvas(Math.ceil(v.width),Math.ceil(v.height));await pg.render({canvasContext:c.getContext('2d'),viewport:v,intent:'print'}).promise;return c})}
function imageTensor(c,max=4000){let r=Math.min(1,max/Math.max(c.width,c.height)),w=Math.max(32,Math.round(c.width*r/32)*32),h=Math.max(32,Math.round(c.height*r/32)*32),t=canvas(w,h),x=t.getContext('2d',{willReadFrequently:true});x.drawImage(c,0,0,w,h);let p=x.getImageData(0,0,w,h).data,a=new Float32Array(3*w*h),mean=[.485,.456,.406],std=[.229,.224,.225];for(let i=0;i<w*h;i++)for(let k=0;k<3;k++)a[k*w*h+i]=(p[i*4+k]/255-mean[k])/std[k];return{a,w,h}}
function blobs(raw,w,h){let seen=new Uint8Array(w*h),out=[];for(let i=0;i<seen.length;i++){if(seen[i]||raw[i]<.3)continue;let q=[i],n=0,x0=w,y0=h,x1=0,y1=0;seen[i]=1;for(let j=0;j<q.length;j++){let z=q[j],x=z%w,y=(z/w)|0;n++;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);for(let d of [-1,1,-w,w]){let v=z+d;if(v<0||v>=seen.length||seen[v])continue;let xx=v%w,yy=(v/w)|0;if((d===-1||d===1)&&yy!==y)continue;if(raw[v]>=.3){seen[v]=1;q.push(v)}}}if(n>=8&&x1-x0>2&&y1-y0>2)out.push([x0,y0,x1+1,y1+1])}return out.sort((a,b)=>a[1]-b[1]||a[0]-b[0]).slice(0,300)}
function cropTensor(c,b){let [x0,y0,x1,y1]=b,w=x1-x0,h=y1-y0,tw=Math.min(3200,Math.ceil(48*w/h/320)*320),t=canvas(tw,48),x=t.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,tw,48);x.drawImage(c,x0,y0,w,h,0,0,Math.min(tw,Math.round(48*w/h)),48);let p=x.getImageData(0,0,tw,48).data,a=new Float32Array(3*48*tw),mean=[.5,.5,.5],std=[.5,.5,.5];for(let i=0;i<48*tw;i++)for(let k=0;k<3;k++)a[k*48*tw+i]=(p[i*4+k]/255-mean[k])/std[k];return{a,tw}}
async function ocrPage(c,det,rec,ort,dict){let d=imageTensor(c),o=await det.run({[det.inputNames[0]]:new ort.Tensor('float32',d.a,[1,3,d.h,d.w])}),m=o[det.outputNames[0]].data,ow=o[det.outputNames[0]].dims.slice(-1)[0],oh=o[det.outputNames[0]].dims.slice(-2)[0],box=blobs(m,ow,oh).map(b=>b.map((v,i)=>v*(i%2?d.h/oh:d.w/ow))).map(b=>[Math.max(0,b[0]-4),Math.max(0,b[1]-4),Math.min(c.width,b[2]+4),Math.min(c.height,b[3]+4)]),lines=[];for(const b of box){let z=cropTensor(c,b),r=await rec.run({[rec.inputNames[0]]:new ort.Tensor('float32',z.a,[1,3,48,z.tw])}),v=r[rec.outputNames[0]],shape=v.dims,T=shape[1],C=shape[2],last=-1,text='',conf=0,nc=0;for(let t=0;t<T;t++){let best=0,score=-Infinity;for(let k=0;k<C;k++)if(v.data[t*C+k]>score){score=v.data[t*C+k];best=k}if(best&&best!==last){text+=dict[best-1]??'';conf+=score;nc++}last=best}if(text.trim()&&conf/(nc||1)>=.3)lines.push(text.trim())}return lines}
async function runOcr(file,provider,el){let t=performance.now(),ort=await import(S.ort);ort.env.wasm.wasmPaths=S.wasm;let options={executionProviders:provider==='WebGPU'?['webgpu','wasm']:['wasm']},base=new URL('./tools/models/ppocr/',location.href),[det,rec,dict]=await Promise.all([ort.InferenceSession.create(new URL('det.onnx',base).href,options),ort.InferenceSession.create(new URL('rec.onnx',base).href,options),fetch(new URL('ppocrv5_dict.txt',base)).then(r=>r.ok?r.text():Promise.reject(Error('字典讀取失敗')))]);let actual=provider==='WASM'?'WASM':(ort.env.webgpu.device?'WebGPU':'WASM（WebGPU 已退回）'),jobs=await pages(file),rows=[],first=[],n=provider==='WASM'?1:jobs.length;for(let i=0;i<n;i++){try{localStorage.setItem(KEY,provider+' 第 '+(i+1)+' 頁')}catch{}let c=await jobs[i](),d=imageTensor(c),do0=performance.now(),mo=await det.run({[det.inputNames[0]]:new ort.Tensor('float32',d.a,[1,3,d.h,d.w])}),detMs=performance.now()-do0;/* reuse the detection output through normal OCR path for a clear separate recognition measurement */let ro0=performance.now(),lines=await ocrPage(c,{inputNames:det.inputNames,outputNames:det.outputNames,run:async()=>mo},rec,ort,dict.split(/\r?\n/)),recMs=performance.now()-ro0;rows.push('第 '+(i+1)+' 頁：偵測 '+sec(detMs)+'；辨識 '+sec(recMs)+'；'+lines.length+' 行');if(!i)first=lines.slice(0,10);c.width=c.height=0;say(el,provider+'（實際：'+actual+'）\n'+rows.join('\n')+'\n第 1 頁前 10 行：\n'+(first.join('\n')||'（沒有辨識文字）'))}try{localStorage.removeItem(KEY)}catch{}await det.release();await rec.release();return {actual,rows,pages:n,ms:performance.now()-t,first}}
async function stageOCR(file){let el=card('1. PP-OCR（偵測＋辨識）'),text=[],runs=[];for(const p of ['WebGPU','WASM'])try{say(el,text.concat(p+' 測試中…').join('\n'));let r=await runOcr(file,p,el);runs.push({provider:p,...r});text.push('✓ '+p+'（實際 '+r.actual+'）：'+sec(r.ms),...r.rows,'第 1 頁前 10 行：',...(r.first.length?r.first:['（無）']))}catch(e){runs.push({provider:p,error:err(e)});text.push('✗ '+p+'：'+err(e))}say(el,text.join('\n'),runs.some(r=>!r.error)?'ok':'bad');log('PP-OCR\n'+text.join('\n'));return runs}
// 版面模型（切圖）：固定版本＋SHA-256；下載一次後放 Cache Storage。前處理同 rapid_layout：800×800、BGR、/255
const LAYOUT={url:'https://www.modelscope.cn/models/RapidAI/RapidLayout/resolve/v1.2.0/onnx/pp_doc_layout/pp_doc_layoutv3.onnx',sha:'250dbad1dfb9e4983fab75e1bf5085cd56ec3f41d5c7d0f8623ec74856e7aa67'};
async function layoutBytes(el){let cache=null,res=null;try{cache=await caches.open('zizi-models-v1');res=await cache.match(LAYOUT.url)}catch{}let fromCache=!!res;if(!res){let r=await fetch(LAYOUT.url);if(!r.ok)throw Error('模型下載失敗 '+r.status);let total=+r.headers.get('content-length')||0,got=0,parts=[],rd=r.body.getReader();for(;;){let {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;say(el,'下載版面模型 '+(got/1048576).toFixed(0)+(total?' / '+(total/1048576).toFixed(0):'')+' MB…')}res=new Response(new Blob(parts));if(cache)try{await cache.put(LAYOUT.url,res.clone())}catch{}}let buf=await res.arrayBuffer();let h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))].map(x=>x.toString(16).padStart(2,'0')).join('');if(h!==LAYOUT.sha){try{await cache?.delete(LAYOUT.url)}catch{}throw Error('模型校驗不符')}return{buf,fromCache}}
function layoutTensor(c){let t=canvas(800,800),x=t.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';x.drawImage(c,0,0,800,800);let p=x.getImageData(0,0,800,800).data,a=new Float32Array(3*640000),o=[2,1,0];for(let i=0;i<640000;i++)for(let k=0;k<3;k++)a[k*640000+i]=p[i*4+o[k]]/255;t.width=t.height=0;return a}
async function runLayout(buf,file,provider,el,ort,done){let t0=performance.now(),s=await ort.InferenceSession.create(new Uint8Array(buf),{executionProviders:provider==='WebGPU'?['webgpu','wasm']:['wasm']}),load=performance.now()-t0,actual=provider==='WASM'?'WASM':(ort.env.webgpu.device?'WebGPU':'WASM（WebGPU 已退回）'),jobs=await pages(file),n=jobs.length,rows=[provider+'（實際 '+actual+'）：載入 '+sec(load)];for(let i=0;i<n;i++){try{localStorage.setItem(KEY,'切圖 '+provider+' 第 '+(i+1)+' 頁')}catch{}let c=await jobs[i](),W=c.width,H=c.height,im=layoutTensor(c),t=performance.now(),out=await s.run({im_shape:new ort.Tensor('float32',new Float32Array([800,800]),[1,2]),image:new ort.Tensor('float32',im,[1,3,800,800]),scale_factor:new ort.Tensor('float32',new Float32Array([800/H,800/W]),[1,2])}),ms=performance.now()-t,b=out.fetch_name_0.data,w=out.fetch_name_0.dims[1],num=Number(out.fetch_name_1.data[0]),cls={};for(let j=0;j<num;j++)if(b[j*w+1]>=.35){let id=Math.round(b[j*w]);cls[id]=(cls[id]||0)+1}rows.push('第 '+(i+1)+' 頁：推論 '+sec(ms)+'；類別→框數 '+JSON.stringify(cls));c.width=c.height=0;say(el,done.concat(rows).join('\n'))}try{localStorage.removeItem(KEY)}catch{}await s.release();return rows}
async function stageLayout(file){let el=card('2. 版面模型（切圖）'),text=[];try{say(el,'準備版面模型…');let t=performance.now(),{buf,fromCache}=await layoutBytes(el);text.push('模型取得：'+sec(performance.now()-t)+(fromCache?'（快取）':'（下載）')+'，校驗通過');let ort=await import(S.ort);ort.env.wasm.wasmPaths=S.wasm;for(const p of ['WASM'])try{text.push(...await runLayout(buf,file,p,el,ort,text))}catch(e){text.push('✗ '+p+'：'+err(e))}say(el,text.join('\n'),text.some(x=>x.startsWith('第 '))?'ok':'bad')}catch(e){text.push('✗ '+err(e));say(el,text.join('\n'),'bad')}log('版面模型\n'+text.join('\n'))}
async function stagePy(){let el=card('3. Pyodide／Excel 可行性'),t=performance.now();try{say(el,'從 jsDelivr 載入 Pyodide 與套件中…');let {loadPyodide}=await import(S.py),py=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/'});await py.loadPackage(['micropip','numpy','opencv-python','lxml']);await py.runPythonAsync("import micropip\nawait micropip.install('openpyxl')");let docx;try{await py.runPythonAsync("import micropip\nawait micropip.install('python-docx')\nimport docx\n'可安裝'");docx='python-docx：micropip 安裝成功'}catch(e){docx='python-docx：micropip 安裝失敗（'+err(e)+'）'}let result=await py.runPythonAsync("import numpy as np, cv2, openpyxl\na=np.zeros((9,9),np.uint8); a[3:6,3:6]=255\nb=cv2.morphologyEx(a,cv2.MORPH_CLOSE,np.ones((3,3),np.uint8))\nwb=openpyxl.Workbook(); ws=wb.active; ws['A1']='iPad 本機測試'; wb.save('/tmp/ipad-ocr-bench.xlsx')\n'cv2='+str(int(b.sum()))+'；Excel='+str(len(wb.sheetnames))");let s='✓ Pyodide 載入與 numpy、opencv-python、openpyxl：'+sec(performance.now()-t)+'\n'+result+'\n'+docx+'\n說明：python-docx 通常可透過 micropip 安裝；本頁已實測其結果。';say(el,s,'ok');log('Pyodide\n'+s)}catch(e){let s='✗ Pyodide：'+err(e)+'\n（OCR／記憶體測試仍已個別執行。）';say(el,s,'bad');log('Pyodide\n'+s)}}
async function stageMemory(runs){let el=card('4. 記憶體／全頁連續處理'),ok=runs.filter(r=>!r.error),bad=runs.filter(r=>r.error);let s=ok.map(r=>'✓ '+r.provider+'：連續完成 '+r.pages+'/'+r.pages+' 頁 OCR').concat(bad.map(r=>'✗ '+r.provider+'：中途失敗／未完成（'+r.error+'）')).join('\n');if(!runs.length)s='✗ 沒有可判定的 OCR 執行結果。';say(el,s,bad.length?'bad':'ok');log('記憶體\n'+s)}
$('#start').onclick=async()=>{let f=$('#file').files[0];$('#start').disabled=true;$('#copy').disabled=true;logs.length=0;stages.replaceChildren();let runs=await stageOCR(f);await stageLayout(f);await stagePy();await stageMemory(runs);$('#start').disabled=false};$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(logs.join('\n\n'));$('#copy').textContent='已複製';setTimeout(()=>$('#copy').textContent='複製結果',1200)}catch{alert('無法自動複製，請長按結果文字複製。')}};
</script></html>
